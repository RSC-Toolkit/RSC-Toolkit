# Data config for extending PAFA (BEATs) to the standard SPRSound task (2022 inter-patient, 7-class).
# **No paper-reported value** — the ICBHI recipe (16 kHz waveform · 5 s repeat_fade · bs 32 · no SpecAug · patient meta) is carried over unchanged.
name: sprsound_pafa_beats
params:
  datamodule_name: index
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 5.0
  pad_type: repeat_fade
  resample_after_slice: true
  time_unit: ms_int
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 32
  num_workers: 8
  shuffle_train: true
  drop_last_train: true
  pin_memory: true
  features:
    enabled: true
    kind: waveform
  feature_precompute: false
  specaugment:
    enabled: false
  meta_label_mode: patient

name: toy
params:
  datamodule_name: index

  dataset_name: toy
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  split_file: sample_data/toy_dataset/official_split.txt
  data_dir: downloaded_datasets/toy   # first build index/ with `rsctk datasets build-index toy --data_dir downloaded_datasets/toy` (raw wavs fall back to the bundled sample_data, but the index is required)

  sampling_rate: 16000
  sample_level: cycle

  train_splits: [train]
  val_splits: [test]
  test_splits: [test]

  batch_size: 32
  num_workers: 4
  shuffle_train: true

  features:
    enabled: true
    kind: fbank
    cache_dir: downloaded_datasets/features_cache_toy   # toy only — the sample_id format matches ICBHI files, so a shared cache could read features of another config
    n_mels: 128
    target_frames: 1024
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: true

  feature_precompute: false
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

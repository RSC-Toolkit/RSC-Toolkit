# MVST 뷰별 AST 미세조정 (공식 {view}/main.py: 비가중 CE, AdamW 5e-5/1e-6, cosine, 50ep, bs8, MA .5, SpecAug 샘플별, AMP, best Score&Se>5).
# 데이터는 patch-mix 와 같은 fbank 캐시(icbhi_patchmix) — 스플릿만 다르다:
#   공식 60/40 (툴킷 주 결과): 기본
#   논문 seed-1 스플릿 (앵커/비교용, 환자 누수 있음): data.params.split_file=rsc_toolkit/datasets/icbhi/data/mvst_seed1_split.txt
#   뷰: model.params.view=16|32|64|128|256
defaults:
  - model: ast_mvst
  - data_defaults@data: base
  - data: icbhi_patchmix
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adamw_mvst
  - trainer: default
  - callbacks: mvst_paper
  - _self_

seed: 1

trainer:
  params:
    precision: 16-mixed

run:
  name: icbhi-mvst-v16
  group: mvst
  tags: [mvst, icbhi]

# DDE-MAE 2단계(분류 FT, 논문 §2.3 (ii)): 1단계 final_state 의 E_R 만 로드 → CE, 50 ep, AdamW 1e-3/wd 5e-4, bs 8(가정), best-on-test.
#   S3: rsctk ... --config-name dde_icbhi_stage2 model.params.encoder_ckpt=outputs/ddemae/icbhi-ddemae-s3-pre-s1/final_state.pth seed=1 run.name=icbhi-ddemae-s3-s1
#   S2: 같은 형식으로 icbhi-ddemae-s2-pre-s1/final_state.pth → run.name=icbhi-ddemae-s2-s1
defaults:
  - model: audiomae_dde_cls
  - data_defaults@data: base
  - data: icbhi_ddemae
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adamw_ddemae_stage2
  - trainer: default
  - callbacks: ddemae_eval
  - _self_

seed: 1

model:
  params:
    encoder_ckpt: ???              # 필수: outputs/ddemae/<stage1 run>/final_state.pth

trainer:
  params:
    max_epochs: 50
    precision: 32

run:
  name: icbhi-ddemae-s3
  group: ddemae
  tags: [ddemae, icbhi, stage2, paper-spec-reimpl]

# RespireNet 재현 실행 config (README/scripts: 200 ep, bs 64, SGD 1e-3/momentum .9/wd 5e-4, 가중 CE [.1,.3,.3,.3],
# WeightedRandomSampler, nlpaug 증강, BRC, fp32, best = test cycle accuracy).
#
#   80/20 fold-4 (원본·ckpt 기준, 목표 66.2~67.1): rsctk-train --config-name respirenet_icbhi run.name=icbhi-respirenet-fold4-s1 seed=1
#   공식 60/40 (툴킷 표준, 목표 55.2~55.7)      : ... data.params.split_mode=official run.name=icbhi-respirenet-official-s1
#   CNN+CBA+BRC 공식 60/40 (가정 런, 2026-09-08 사용자 결정; 목표 README 55.7):
#       ... data.params.split_mode=official data.params.aug_scale=1 data.params.cba_seed=1 run.name=icbhi-respirenet-cba-s1
# 장치별 FT 는 재현 범위 밖.
defaults:
  - model: respirenet
  - data: icbhi_respirenet
  - loss: cross_entropy_respirenet
  - metrics: icbhi_metrics
  - optimizer: sgd
  - trainer: default
  - callbacks: respirenet_paper
  - _self_

seed: 1

trainer:
  params:
    max_epochs: 200
    precision: 32              # 원본은 AMP 없음

run:
  name: icbhi-respirenet-fold4
  group: respirenet
  tags: [respirenet, icbhi]

params:
  max_epochs: 50
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: lightning_logs
    name: ${run.name}

  # 콜백은 여기 인라인으로 두지 않고 `callbacks` config 그룹에서 고른다.
  # (configs/callbacks/{ema,none}.yaml — 상위 config 의 defaults 목록 참고)
  callbacks: []

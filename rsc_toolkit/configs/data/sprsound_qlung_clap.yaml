# QLung (Audio-CLAP) 의 SPRSound 데이터 설정 — SPRSound 표준 태스크(2022 inter-patient, 7-class) 직접 학습·검증 (SPR→SPR).
#
# icbhi_qlung_clap.yaml 의 CLAP 경로(48 kHz → 8 s repeat_fade → ClapProcessor log-mel (1, 1001, 64), AQS 는 48 kHz 파형에서)를
# sprsound_qlung.yaml 의 데이터셋 인자(Classification/ 하위, index_cycle.csv, 녹음 전체 리샘플 후 절단, time_unit s)에 얹었다.
# 논문 앵커 없음(QLung 논문은 SPRSound 를 OOD 로만 썼다) → 재현 판정 대상이 아니라 **툴킷 확장 관찰값** (2026-09-10 사용자 요청).
# 피처·AQS 캐시는 AST 판(sprsound_qlung)·ICBHI CLAP 판과 분리한다 — 체인(48 kHz, time_unit s)이 다르다.
name: sprsound_qlung_clap
params:
  datamodule_name: qlung
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.qlung_data.QLungAQSIndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification   # recording_path 는 Classification/ 기준 상대경로
  index_filename: index_cycle.csv
  sampling_rate: 48000           # CLAP 경로 (AST 판은 16000)
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade          # BTS/Audio-CLAP 원본 전처리와 동일
  fade: true
  resample_after_slice: false    # 녹음 전체를 48 kHz 로 리샘플한 뒤 구간 절단 (sprsound_qlung 과 같은 규칙)
  time_unit: s
  train_splits: [train]
  val_splits: [test]             # best-on-test — 다른 행과 동일 프로토콜
  test_splits: [test]
  batch_size: 8
  num_workers: 8
  shuffle_train: true
  drop_last_train: true          # 원본 train loader drop_last=True
  pin_memory: true
  features:
    enabled: true
    kind: clap
    cache_dir: downloaded_datasets/features_cache_qlung_clap_sprs
    clap_model_name: laion/clap-htsat-unfused
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0
  specaugment:
    enabled: false               # CLAP 경로에는 원본 AST 의 배치 SpecAugment 가 없다
  qlung:
    alpha: 0.7                   # --quality_alpha
    beta: 0.3                    # --quality_beta
    entropy_source: rms          # AST 판 주 결과와 같은 해석(코드 그대로 = rms 중복 전달 버그 포함)
    formula: code
    cache_dir: downloaded_datasets/aqs_cache_clap48k_sprs   # 48 kHz 파형 기준 · SPRSound 전용
    precompute: true
    precompute_num_workers: 8
    attach_val: true

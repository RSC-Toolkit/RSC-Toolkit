# QLung (Audio-CLAP) 재현 실행 config — 논문 Table 1·2 의 두 번째 백본 변형.
#
# 논문 앵커: ICBHI 81.98 / 44.81 / 63.39±0.40 · SPRSound OOD 74.71 / 44.88 / 59.80±3.51
#            (AST 판보다 각각 +1.38 / +1.57 — 논문에서는 이쪽이 더 좋다)
#
# **등급 C (명세 재구현).** 저자 저장소에 Audio-CLAP 백본 코드가 없어 논문 서술 + AST 코드의 방법부로
# 재구성했다. 가정 3건은 models/clap_qlung.py 독스트링 참조.
#
#   QLung (Audio-CLAP) : rsctk-train --config-name qlung_clap_icbhi seed=N run.name=icbhi-qlung-clap-sN
#   기준선 대조(CE)     : ... model.params.method=ce run.name=icbhi-qlung-clap-ce-sN
#     └ 같은 데이터 경로의 Audio-CLAP 선형 헤드 → (방법 − 기준선) 이득을 잴 수 있다.
#       참고로 저자 배포 .pt 를 쓰는 순수 Audio-CLAP(bts_icbhi model.name=audioclap)은 62.76±1.15 다.
#
# 손실·최적화는 AST 판과 같다(비가중 CE, adam 5e-5/wd 1e-6, cosine, MA 0.6, 50 ep, bs 8, AMP).
defaults:
  - model: clap_qlung
  - data_defaults@data: base
  - data: icbhi_qlung_clap
  - loss: cross_entropy        # 비가중 CE (criterion[0])
  - metrics: icbhi_metrics
  - optimizer: adam            # lr 5e-5, wd 1e-6
  - trainer: default           # max_epochs 50
  - callbacks: qlung_paper     # MA 0.6(dfam 제외) · PaperCosineLR · best-on-test(Se>5) · 재개용 last.ckpt
  - _self_

seed: 1

trainer:
  params:
    precision: 16-mixed        # 원본 AMP

run:
  name: icbhi-qlung-clap
  group: qlung
  tags: [qlung, clap, icbhi, grade-c]

# AMS-D: 표준 4-class ICBHIScore(S_p/S_e/icbhi_score) + 논문 이진 산식(paper_S_p/paper_S_e/paper_score, 비표준) 둘 다 기록
train:
  - name: topk_accuracy
    params:
      topk: [1]

val:
  - name: topk_accuracy
    params:
      topk: [1]
  - name: icbhi_score
    params:
      num_classes: 4
      normal_index: 0
      topk: 1
  - name: icbhi_paper_binary
    params:
      normal_index: 0

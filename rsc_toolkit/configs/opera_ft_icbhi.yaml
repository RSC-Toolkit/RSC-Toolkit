# OPERA-CT 전체 미세조정, ICBHI 4-class — 툴킷 표준 태스크 (논문·저장소에 목표치 없음: OPERA 는 레코딩 단위 T7 만 보고).
#   EMBC 동결 레시피에서 freeze_body 만 끄고 lr 5e-5(M2D TASLP 미세조정 값)·bs 64 로 낮춘 툴킷 정의 레시피. 나머지 동일(150ep, cosine T40, 가중 CE).
#   실행: rsctk-train --config-name opera_ft_icbhi run.name=icbhi-operact-ft-s1 seed=1
defaults:
  - model: opera_ct
  - data_defaults@data: base
  - data: icbhi_opera
  - loss: cross_entropy_weighted_icbhi
  - metrics: icbhi_metrics
  - optimizer: adam_m2d
  - trainer: default
  - callbacks: opera_eval
  - _self_

seed: 1

model:
  params:
    freeze_body: false

data:
  params:
    batch_size: 64

optimizer:
  params:
    lr: 5e-5

trainer:
  params:
    max_epochs: 150
    precision: 32

run:
  name: icbhi-operact-ft
  group: opera
  tags: [opera, icbhi, finetune]

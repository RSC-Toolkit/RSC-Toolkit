# LoRA-RSC extended to the standard SPRSound task (7-class). ICBHI recipe unchanged:
# resample to 16 kHz (after loading the segment) → sclmeta 8 s circular padding + fade_out → kaldi fbank 128 × 500 frames (first 5 s) → bs 16, drop_last False.
# Waveform noise follows the public code (scalar DC = no effect), so, as in the ICBHI default, it is not applied.
name: sprsound_lorarsc
params:
  datamodule_name: index
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: sclmeta
  fade: false
  resample_after_slice: true
  time_unit: ms_int
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 16
  num_workers: 8
  shuffle_train: true
  drop_last_train: false
  pin_memory: true
  features:
    enabled: true
    kind: fbank
    cache_dir: downloaded_datasets/features_cache
    n_mels: 128
    target_frames: 500
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: true
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 8
  specaugment:
    enabled: false

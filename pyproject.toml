[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsc-toolkit"
version = "0.1.0"
description = "Respiratory Sound Classification Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "pydantic",
    "librosa",
    "tqdm",

    # Below versions must be compatible with eachother
    "torch==2.7.0",
    "torchaudio==2.7.0", # before torchcodec change
    "torchvision==0.22.0",
    "torchcodec",
]

[project.optional-dependencies]
trainer = [
    "hydra-core",
    "lightning",
]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
]

[project.scripts]
rsc-toolkit-train = "rsc_toolkit.train:main"
rsc-toolkit = "rsc_toolkit.cli:main"
rsctk = "rsc_toolkit.cli:main"

[tool.setuptools]
packages = ["rsc_toolkit"]

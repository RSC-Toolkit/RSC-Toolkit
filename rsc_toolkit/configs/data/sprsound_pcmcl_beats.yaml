# PC-MCL(BEATs) 를 SPRSound 표준 태스크(7-class)로 확장. ICBHI 레시피 그대로:
# 16 kHz 파형 · 평가 사이클 10 s repeat+fade · bs32 · 동적 연결(11 조합)·PM 쌍.
# SPRSound 는 meta 의 patient_id 로 환자를 식별한다(ICBHI 의 quirk 인 patient_id_mode=recording 도 그대로 유지 —
# 공식 코드 동작을 바꾸지 않는다는 P0 원칙).
name: sprsound_pcmcl_beats
params:
  datamodule_name: pcmcl
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 10.0
  pad_type: repeat_fade
  resample_after_slice: true
  time_unit: ms_int
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 32
  num_workers: 8
  shuffle_train: true
  drop_last_train: true
  pin_memory: true
  features:
    enabled: true
    kind: waveform
  feature_precompute: false
  specaugment:
    enabled: false
  pcmcl:
    mode: default
    mixing_prob: 1.0
    conditional_mixing: false
    mixing_label_strategy: additive
    enable_ssl: true
    ssl_prob: 0.3
    patient_id_mode: recording
    hard_negative_mode: dict_order
    cache_dir: outputs/pcmcl/cache_sprs

# AMS-D 를 SPRSound 표준 태스크(7-class)로 확장. ICBHI 레시피 그대로:
# 16 kHz · 8 s repeat 패딩(fade 없음) → raw kaldi fbank 128 × 798 → AMSDFeatureDataset 이 마스킹 후 정규화. bs24, drop_last True.
# ICBHI 와 마찬가지로 `dataset_aug`(논문 §3.1, 생성 스크립트 미공개) 는 쓰지 않는다 — 알려진 결손.
# 지표는 ICBHI 확장과 같은 표준 7-class Se/Sp/Score 를 쓴다(논문의 이진 Se/Sp 는 ICBHI 앵커 비교 전용).
name: sprsound_amsd
params:
  datamodule_name: amsd
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat
  fade: false
  time_unit: ms_int
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 24
  num_workers: 8
  shuffle_train: true
  drop_last_train: true
  pin_memory: true
  features:
    enabled: true
    kind: fbank
    cache_dir: downloaded_datasets/features_cache_amsd
    n_mels: 128
    target_frames: 798
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: false
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 8
  specaugment:
    enabled: false
  amsd_freqm: 48
  amsd_timem: 192
  amsd_mean: -4.2677393
  amsd_std: 4.5689974
  amsd_return_index: true

name: ci

on:
  push:
    branches: ["main", "refactor/**", "chore/**"]
  pull_request:

jobs:
  wheel-smoke:
    # 휠 빌드 → 빈 venv 설치 → 저장소 밖 cwd 에서 import·registry·번들 데이터·config 합성·콘솔 스크립트 (P2-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0 torchaudio==2.7.0 torchvision==0.22.0
          python -m pip install -e ".[trainer,models,dev]"
      - name: Wheel smoke
        run: PY=python scripts/packaging/smoke_installed_wheel.sh

  unit-tests:
    # 골든 텐서 회귀 포함 단위 테스트 (CPU). 스레드 캡 env 는 걸지 않는다 — 비트 단위 비교가 깨진다.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0 torchaudio==2.7.0 torchvision==0.22.0
          python -m pip install -e ".[trainer,models,dev]"
      - name: Unit tests
        # exact_golden: 비트 단위 골든 비교(SpecAugment·PAFA head 등)는 CPU/BLAS 가 다른 러너에서 마지막 자리에서 어긋난다 —
        # 개발 머신(GPU 서버)에서 돈다. 사전학습 체크포인트·실데이터가 필요한 테스트는 각자 skipif 로 건너뛴다.
        run: python -m pytest tests/unit -q -m "not slow and not exact_golden" -p no:cacheprovider

  tutorial:
    # 튜토리얼 노트북 Part A(toy, CPU) 를 nbconvert 로 실제 실행한다 — 설치 → 인덱스 → 학습 → 재평가 → 플러그인 모델.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.0 torchaudio==2.7.0 torchvision==0.22.0
          python -m pip install -e ".[trainer,models,notebook]"
      - name: Run tutorial (Part A)
        run: PY=python RSC_TUTORIAL_WORK=/tmp/rsc_tutorial scripts/tutorial/run_tutorial.sh

# Lungmix (ICASSP 2025) ICBHI data — re-implementation from the paper specification: 16 kHz, band-pass 50–1500 Hz (assumption: 4th-order butter, zero-phase, before padding),
# 9 s pad/cut (assumption: repeat; preprocessing order assumed, mixing on raw segments then 9 s), raw waveform (kind: waveform, no cache — mixing and fbank run online inside the model). Official 60/40 split, best-on-test.
# batch 4 (+ trainer accumulate_grad_batches 8 = effective 32, paper §III-B).
name: icbhi_lungmix
params:
  datamodule_name: lungmix
  dataset_name: icbhi
  index_dataset_cls: rsc_toolkit.datasets.lungmix_data.LungmixIndexDataset
  project_root: ${hydra:runtime.cwd}
  split_file: rsc_toolkit/datasets/icbhi/data/official_split.txt
  data_dir: .datasets/icbhi

  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 9.0
  pad_type: repeat               # assumption
  fade: false
  resample_after_slice: true     # reads and resamples only the segment (whole-recording resampling is slow on the uncached waveform path; as in icbhi_opera)

  train_splits: [train]
  val_splits: [test]
  test_splits: [test]

  batch_size: 4
  num_workers: 4
  shuffle_train: true
  drop_last_train: false
  pin_memory: true

  features:
    enabled: true
    kind: waveform
  feature_precompute: false

  lungmix:
    label_map: none
    emit_valid_len: true       # puts the original segment length (before padding) into meta_labels of train batches (default path for model mix_stage=raw; can be false for the padded alternative)
    bandpass:
      enabled: true
      kind: butter               # assumption
      order: 4
      zero_phase: true
      low_hz: 50.0
      high_hz: 1500.0
      before_pad: true           # applied per cycle segment (assumption; per-recording alternative not implemented)

# AMS-D (ICASSP 2026, CcnNnn/AMS-D) AST base384 16/16, 128×798 → 8×49 tokens, full load of the AudioSet 16/16 ckpt (HF-converted) + pos_embed truncated along time.
# Official main.py defaults: mask_ratio 0.39 (153/392), mask_dense 0 (hard), attentive, α 1.0 / β 0.03 / γ 0.3 / τ 1, soft distillation (double-softmax teacher kept).
# method: amsd (default) | sd_mask | sd_only | baseline (Table 3), mask_mode: attentive | random | time_inter | freq_inter (Table 2)
name: ast_amsd
params:
  n_cls: 4
  input_fdim: 128
  input_tdim: 798
  fshape: 16
  tshape: 16
  fstride: 16
  tstride: 16
  pretrained_path: null            # pretrained_models/upstream/audioset_16_16_0.4422.pth
  mask_ratio: 0.39
  mask_dense: 0.0
  mask_mode: attentive
  method: amsd
  num_train_samples: 4142          # number of official 60/40 train cycles (the callback corrects it from the datamodule length)
  alpha: 1.0
  beta: 0.03
  gamma: 0.3
  tau: 1.0
  distillation_type: soft
  teacher_is_prob: false           # assumption flag: true = paper Eq. 1 taken literally (removes the double softmax)
  noise_enabled: true              # noise + time roll from epoch ≥10 (mydataset.py:126-129; amplitude and roll use an assumed derived RNG)
  noise_start_epoch: 10
  noise_seed: 2345
  input_layout: freq_time

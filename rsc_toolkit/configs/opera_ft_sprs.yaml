# OPERA-CT 전체 미세조정, SPRSound 7-class — 툴킷 표준 태스크 (목표치 없음). EMBC SPRS 레시피에서 freeze_body 끄고 lr 5e-6(M2D SPRS 값)·bs 64.
#   실행: rsctk-train --config-name opera_ft_sprs run.name=sprs-operact-ft-s1 seed=1
defaults:
  - model: opera_ct
  - data_defaults@data: base
  - data: sprsound_opera
  - loss: cross_entropy
  - metrics: sprsound_metrics
  - optimizer: adam_m2d
  - trainer: default
  - callbacks: opera_eval
  - _self_

seed: 1

model:
  params:
    n_cls: 7
    freeze_body: false

data:
  params:
    batch_size: 64

optimizer:
  params:
    lr: 5e-6

trainer:
  params:
    max_epochs: 50
    precision: 32

run:
  name: sprs-operact-ft
  group: opera
  tags: [opera, sprsound, finetune]

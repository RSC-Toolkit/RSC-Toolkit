# MVST 를 SPRSound 표준 태스크(7-class)로 확장. **논문 목표치 없음** — ICBHI 레시피 그대로.
#   뷰 5개를 각각 학습한 뒤 융합 MLP 를 얹는 3단계 구성이라 seed 당 6 run 이다.
#   rsctk-train --config-name mvst_sprs model.params.view=16 seed=N run.name=sprs-mvst-v16-sN
#   ... view=32|64|128|256 → 마지막에 fusion
defaults:
  - model: ast_mvst
  - data_defaults@data: base
  - data: sprsound_patchmix
  - loss: cross_entropy
  - metrics: sprsound_metrics
  - optimizer: adamw_mvst
  - trainer: default
  - callbacks: mvst_paper
  - _self_

seed: 1

trainer:
  params:
    precision: 16-mixed

run:
  name: sprs-mvst
  group: mvst
  tags: [mvst, sprsound, extension]

model:
  params:
    n_cls: 7

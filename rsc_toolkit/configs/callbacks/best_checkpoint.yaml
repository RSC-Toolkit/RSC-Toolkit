# @package _global_
# 범용 best 체크포인트: 검증(val_splits) 의 ICBHI Score 가 최고일 때 outputs/<run.group>/<run.name>/best.pth·best.json 을 쓴다.
# 논문 재현 config 들은 각자의 콜백 묶음(patchmix_paper 등)을 쓰고, 이것은 튜토리얼·자기 모델 학습용 기본값이다.
#   rsc-toolkit-train --config-name default data=toy_fbank model=cnn callbacks=best_checkpoint run.name=my-run run.group=my-group
trainer:
  params:
    callbacks:
      - _target_: rsc_toolkit.trainer.callbacks.icbhi_best_checkpoint.ICBHIBestScoreCheckpoint
        dirpath: outputs/${run.group}/${run.name}
        min_se: -1.0          # Se 게이트 없음 (논문 프로토콜을 따를 때만 5.0 등으로)

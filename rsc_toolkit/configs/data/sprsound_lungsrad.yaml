# Lung-SRAD(팀) 를 SPRSound 표준 태스크(7-class)로 확장. **논문 목표치 없음** — ICBHI 레시피 그대로.
# 16 kHz·8 s repeat_fade·bs16·per-sample 정규화·SpecAugment(icbhi_ast_sup)·50 epoch.
name: sprsound_lungsrad
params:
  datamodule_name: index
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  time_unit: ms_int
  resample_after_slice: true
  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 16
  num_workers: 8
  shuffle_train: true
  drop_last_train: true
  pin_memory: true
  features:
    enabled: true
    kind: fbank
    cache_dir: downloaded_datasets/features_cache
    n_mels: 128
    target_frames: 798
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: true
    per_sample_stats: true
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 8
  specaugment:
    enabled: true
    policy: icbhi_ast_sup
    mask: mean

# SCL-metadata 사전학습 run (SCL / M-SCL): 400ep, bs128, Adam 1e-4/wd 1e-4 + cosine(T_max 40), 평가 없음, 마지막 상태 저장.
#   M-SCL : rsctk-train --config-name sclmeta_icbhi_pretrain run.name=icbhi-sclmeta-mscl-pre-s1 seed=1
#   SCL   : ... model.params.method=scl run.name=icbhi-sclmeta-scl-pre-s1
defaults:
  - model: cnn6_sclmeta
  - data_defaults@data: base
  - data: icbhi_sclmeta
  - loss: cross_entropy_weighted_icbhi   # 미사용 (SupCon 만) — 인터페이스용
  - metrics: icbhi_metrics
  - optimizer: adam_sclmeta
  - trainer: default
  - callbacks: sclmeta_pretrain
  - _self_

seed: 1
model:
  params:
    method: mscl

trainer:
  params:
    max_epochs: 400
    precision: 32
    limit_val_batches: 0        # 원본 사전학습은 평가 없음
    num_sanity_val_steps: 0

run:
  name: icbhi-sclmeta-mscl-pre
  group: sclmeta
  tags: [sclmeta, icbhi, pretrain]

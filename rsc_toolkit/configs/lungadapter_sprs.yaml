# **M2D SPRS 프로토콜** 적용(2026-08-30 사용자 결정: "SPRSound 를 안 쓴 모델은 M2D 에서 활용한 학습·검증 방식으로").
#   가져온 것: 8 s·pad sclmeta·ms_int 슬라이싱·batch 64·SpecAug 없음·Adam wd 1e-4 + cosine(T_max 40)·fp32·50 ep·
#              비가중 CE·best-on-test Score(Se 게이트 없음)·MA 없음·7-class 2022 inter-patient.
#   못 가져온 것: 특징 추출(M2D 는 sclmeta_mel 80-bin, AST 계열은 128x798 fbank 전제) 과 lr(백본 native 유지).
# lungadapter 를 **SPRSound 표준 태스크(2022 inter-patient, 7-class)** 로 확장 — **논문 목표치 없음**(툴킷 자체 관찰).
# 논문은 ICBHI 만 실험했다. 재현 판정 대상이 아니라 교차 데이터 일반화 관찰용이다.
# LungAdapter(Interspeech 2024) ICBHI 4-class 공식 60/40 — 논문 명세 재구현 (코드 없음).
#   논문 명시: Adam lr 5e-4, cosine, bs 8, 50 ep, weighted CE, IN+AS AST 동결, 어댑터 hidden 16 / ratio 0.15, 5 random runs.
#   Bae [13] 상속 **추정**: 데이터 파이프라인(icbhi_patchmix: 16 kHz, 8 s repeat+fade, fbank 128/798, SpecAugment icbhi_ast_sup 항상),
#   weighted CE 산식(class_nums), AMP(16-mixed), MA 0.5, best-on-test(Se>5), wd 1e-6 (어댑터 스케일 s1/s2 에도 적용).
#   창 함수: 논문 표기 '25 ms Hamming' 이나 Bae 코드 상속(kaldi fbank hanning, processors/mel.py) → hanning 사용 (표기 불일치 문서화).
#   앵커: Table 1 80.43/44.37/62.40±1.11 (Fig.2 벡터 복원은 75.53/45.21/60.37 — 논문 내부 불일치).
#   실행: .venv/bin/python -m rsc_toolkit.train --config-name lungadapter_icbhi run.name=icbhi-lungadapter-s1 seed=1
#   스모크: ... run.name=smoke-lungadapter seed=1 trainer.params.max_epochs=1 +trainer.params.limit_train_batches=3 +trainer.params.limit_val_batches=3
#   ablation: ... model.params.use_res_adapter=false run.name=icbhi-lungadapter-attnonly-s1
#             ... model.params.use_attn_adapter=false run.name=icbhi-lungadapter-resonly-s1
defaults:
  - model: ast_lungadapter
  - data_defaults@data: base
  - data: sprsound_ast_m2dproto
  - loss: cross_entropy            # SPRS 확장은 비가중 CE (ICBHI 4-class 가중치는 클래스 수가 달라 사용 불가)
  - metrics: sprsound_metrics
  - optimizer: adam_m2d          # M2D SPRS 프로토콜: Adam wd 1e-4 + cosine(T_max 40, eta_min 1e-6), lr 은 백본 native
  - trainer: default              # max_epochs 50
  - callbacks: sprs_m2d_protocol   # best-on-test(Se 게이트 없음) + 재개, MA 없음
  - _self_

seed: 1

trainer:
  params:
    precision: 32              # M2D SPRS 프로토콜(fp32)

run:
  name: sprs-lungadapter
  group: lungadapter
  tags: [lungadapter, icbhi]

model:
  params:
    n_cls: 7

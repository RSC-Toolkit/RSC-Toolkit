# @package _global_
# sgscl 논문 AST 학습 프로토콜 콜백 (patch-mix 와 동일 값 — 같은 저자 계열 레시피):
#   - 매 iteration 직전 가중치와 0.5:0.5 live 평균 (--ma_update --ma_beta 0.5)
#   - epoch 단위 cosine LR (eta_min = lr * 0.1^3), warmup 없음
#   - best-on-test 선택: Score 최고 && Se > 5 일 때 저장 (원본 validate 와 동일)
trainer:
  params:
    callbacks:
      - _target_: rsc_toolkit.trainer.callbacks.ma_update.LiveWeightAveraging
        beta: 0.5
      - _target_: rsc_toolkit.trainer.callbacks.paper_cosine_lr.PaperCosineLR
        learning_rate: 5e-5
        epochs: 50
      - _target_: rsc_toolkit.trainer.callbacks.icbhi_best_checkpoint.ICBHIBestScoreCheckpoint
        dirpath: outputs/sgscl/${run.name}
        min_se: 5.0

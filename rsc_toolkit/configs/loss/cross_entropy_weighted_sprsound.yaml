# patch-mix --weighted_loss 를 SPRSound 에 적용: 1/(n/합) 정규화 가중 CE (ICBHI 판과 같은 산식).
# class_nums 는 SPRSound 2022 inter-patient **train** 분포 7-class (합 6,656) — 서버 실데이터 집계.
#   Normal 5159 / Fine Crackle 912 / Wheeze 452 / Coarse Crackle 49 / Wheeze+Crackle 30 / Rhonchi 39 / Stridor 15
# ICBHI 에서 가중 CE 를 쓰는 논문(AST SFT·LungAdapter)의 SPRS 확장에서 "같은 레시피" 를 유지하기 위한 대응물이다.
name: cross_entropy_from_counts
params:
  class_nums: [5159, 912, 452, 49, 30, 39, 15]

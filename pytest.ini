[pytest]
# 수집 범위를 우리 테스트로 한정한다.
# (2026-09-01) 이 줄이 없으면 pytest 가 리포 전체를 훑다가 outputs/reference/ 아래
# 저자 저장소 사본(dass_upstream·opera 등)의 테스트 파일까지 수집하려다
# ModuleNotFoundError 로 4 errors 를 내고 "Interrupted: 4 errors during collection" 으로
# 수집 단계에서 통째로 중단된다 — DEV.md 가 안내하는 `pytest` 가 그대로는 돌지 않았다.
testpaths = tests
norecursedirs = outputs downloaded_datasets lightning_logs pretrained_models .venv* notebooks .git

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

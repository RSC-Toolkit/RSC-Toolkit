# Domain Transfer extended to the standard SPRSound task (7-class). **No paper-reported value** — ICBHI recipe unchanged.
# 8 kHz → event segmentation → circular padding to 8 s (including test) + per-class splice · 3 waveform augmentations for training only.
# DomainTransferDataModule computes the class weights automatically from the SPRSound train distribution (including splices).
name: sprsound_domaintransfer
params:
  datamodule_name: domaintransfer
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  time_unit: ms_int
  sampling_rate: 8000
  sample_level: cycle
  desired_length_sec: null
  fade: false
  target_len: 64000
  splice_per_class: 500
  aug_prob: 0.5
  use_noise: true
  use_stretch: true
  use_pitch: true
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 64
  num_workers: 8
  shuffle_train: true
  drop_last_train: false
  pin_memory: true
  features:
    enabled: true
    kind: waveform
  feature_precompute: false
  specaugment:
    enabled: false

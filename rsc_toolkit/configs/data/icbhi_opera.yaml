# OPERA-CT(EMBC 경로) ICBHI 데이터: sclmeta 파형 전처리(구간 리샘플·순환 패딩 8 s, 16 kHz) 를 파형 그대로 넘긴다
# (배치 단위 trim·mel64·dB·min-max 는 모델 transform 이 담당 — 배치 의존이라 캐시 불가). bs 256 (ev_icbhi_opera.sh), drop_last 없음.
name: icbhi_opera
params:
  datamodule_name: index
  dataset_name: icbhi
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  split_file: rsc_toolkit/datasets/icbhi/data/official_split.txt
  data_dir: .datasets/icbhi

  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: sclmeta
  fade: false
  resample_after_slice: true

  train_splits: [train]
  val_splits: [test]
  test_splits: [test]

  batch_size: 256
  num_workers: 8
  shuffle_train: true
  drop_last_train: false
  pin_memory: true

  features:
    enabled: true
    kind: waveform               # 캐시 없음
  feature_precompute: false

  specaugment:
    enabled: false

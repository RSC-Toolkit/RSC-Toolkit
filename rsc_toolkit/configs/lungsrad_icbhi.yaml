# Lung-SRAD(DASS-medium) ICBHI 4-class — 공식 코드 기본값: 50ep, bs16 drop_last, AdamW 5e-5/wd 1e-6 + epoch 코사인, 비가중 CE,
#   MA 0.5, per-sample fbank 정규화 + SpecAug(icbhi_ast_sup, mean) → 모델 내부 Resize(128→128, 798→1024), fp16 autocast(무 GradScaler), best-on-test(Se>5).
#   논문(공식 60/40, 5 seeds): FT 61.06±1.27 → SAR 62.22±1.29 → Lung-SRAD 64.48±0.25 (2-class 파생 68.20 / 68.40 / 72.57).
#   사다리: model.params.method=ce (FT) | ce_blur (SAR) | patchmix_cl (Lung-SRAD, cl_mode dual; time|freq|2d = Table 2)
#   축 정의: model.params.mix_layout=as_code (기본, 원본 동작) | as_paper (Eq.6-7)
#   실행: rsctk-train --config-name lungsrad_icbhi run.name=icbhi-lungsrad-dual-s1 seed=1 model.params.method=patchmix_cl
defaults:
  - model: dass_lungsrad
  - data_defaults@data: base
  - data: icbhi_lungsrad
  - loss: cross_entropy         # 원본 --weighted_loss 미사용
  - metrics: lungsrad_metrics   # 4-class + 2-class 파생
  - optimizer: adamw_addrsc     # AdamW lr 5e-5, wd 1e-6 (원본 misc.py: 'adam' → AdamW)
  - trainer: default
  - callbacks: lungsrad_paper
  - _self_

seed: 1

trainer:
  params:
    max_epochs: 50
    precision: 32               # AMP 는 모델 내부 autocast (GradScaler 없음, 원본 그대로)

run:
  name: icbhi-lungsrad
  group: lungsrad
  tags: [lungsrad, icbhi, dass]

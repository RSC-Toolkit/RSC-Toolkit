# patchmix family extended to the **standard SPRSound task (2022 inter-patient, 7-class)** — no paper-reported value (toolkit results).
# The paper evaluates ICBHI only. Used to observe cross-dataset generalization; not a reproduction target.
# patch-mix family reproduction run config.
#
#   AST SFT      : rsctk-train --config-name patchmix_icbhi
#   Patch-Mix CE : ... model.params.method=patchmix loss=cross_entropy run.name=icbhi-patchmix-ce
#   Patch-Mix CL : ... model.params.method=patchmix_cl loss=cross_entropy run.name=icbhi-patchmix-cl
#   (repeat for seeds 1-5: seed=N)
#
# Prerequisite: .datasets/icbhi downloaded + build-index done.
defaults:
  - model: ast_patchmix
  - data_defaults@data: base
  - data: sprsound_patchmix
  - loss: cross_entropy_weighted_sprsound   # weighted CE of the ICBHI recipe, mapped to the SPRS distribution (same formula)
  - metrics: sprsound_metrics
  - optimizer: adam            # lr 5e-5, wd 1e-6 — paper values
  - trainer: default           # max_epochs 50
  - callbacks: patchmix_paper
  - _self_

seed: 1

trainer:
  params:
    precision: 16-mixed        # official AMP (GradScaler + autocast)

run:
  name: sprs-ast-sft
  group: patchmix
  tags: [patchmix, icbhi]

model:
  params:
    n_cls: 7

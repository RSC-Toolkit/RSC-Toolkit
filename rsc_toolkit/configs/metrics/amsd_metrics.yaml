# AMS-D: records both the standard 4-class ICBHIScore (S_p/S_e/icbhi_score) and the paper's binary formula (paper_S_p/paper_S_e/paper_score, non-standard)
train:
  - name: topk_accuracy
    params:
      topk: [1]

val:
  - name: topk_accuracy
    params:
      topk: [1]
  - name: icbhi_score
    params:
      num_classes: 4
      normal_index: 0
      topk: 1
  - name: icbhi_paper_binary
    params:
      normal_index: 0

# PAFA-family reproduction run config (official scripts/beats_{ce,pafa}.sh: 100 ep, bs 32, adam 5e-5/wd 1e-6, cosine, MA 0.5, unweighted CE, AMP, nospec).
#
#   BEATs + PAFA : rsctk-train --config-name pafa_icbhi run.name=icbhi-beats-pafa-s1 seed=1
#   BEATs + CE   : ... model.params.method=ce run.name=icbhi-beats-ce-s1
#   2-class: model.params.n_cls=2 + a 2-class data index (separate training; not yet available)
defaults:
  - model: beats
  - data_defaults@data: base
  - data: icbhi_pafa_beats
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adam            # lr 5e-5, wd 1e-6
  - trainer: default
  - callbacks: pafa_paper
  - _self_

seed: 1

trainer:
  params:
    max_epochs: 100
    precision: 16-mixed        # official AMP

run:
  name: icbhi-beats-pafa
  group: pafa
  tags: [pafa, beats, icbhi]

# @package _global_
# LoRA-RSC training protocol: per-step CosineAnnealingLR (T_max=259×100, eta_min 0, no warmup), no MA/EMA,
# best-on-test = best official test Score every epoch (no Se gate → min_se -1), resumable.
trainer:
  params:
    callbacks:
      - _target_: rsc_toolkit.trainer.callbacks.step_cosine_lr.StepCosineLR
        epochs: ${trainer.params.max_epochs}
        eta_min: 0.0
      - _target_: rsc_toolkit.trainer.callbacks.icbhi_best_checkpoint.ICBHIBestScoreCheckpoint
        dirpath: outputs/lorarsc/${run.name}
        min_se: -1.0
      - _target_: rsc_toolkit.trainer.callbacks.resume_checkpoint.EpochResumeCheckpoint
        dirpath: outputs/lorarsc/${run.name}

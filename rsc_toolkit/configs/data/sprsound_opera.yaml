# OPERA-CT (EMBC path) SPRSound data: sclmeta SPRS waveform preprocessing (integer-ms onsets, 8 s circular padding, 16 kHz), raw waveforms. bs 256 (ev_sprs_opera.sh).
name: sprsound_opera
params:
  datamodule_name: index
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv

  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: sclmeta
  fade: false
  resample_after_slice: true
  time_unit: ms_int

  train_splits: [train]
  val_splits: [test]
  test_splits: [test]

  batch_size: 256
  num_workers: 8
  shuffle_train: true
  drop_last_train: false
  pin_memory: true

  features:
    enabled: true
    kind: waveform
  feature_precompute: false

  specaugment:
    enabled: false

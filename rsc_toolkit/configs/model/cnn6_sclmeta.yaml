# SCL-metadata (ICASSP 2023) CNN6 — faithful port of the official code.
#   method: ce | hybrid | scl | mscl | linear  (scl/mscl are pretraining; linear requires encoder_ckpt)
name: cnn6_sclmeta
params:
  n_cls: 4
  method: mscl
  from_sl_official: true       # partial load of PANN AudioSet Cnn6 (with --scratch: false + lr 1e-3)
  out_dim: 128
  temperature: 0.06
  alpha: 0.5
  lam: 0.75
  freq_mask: 20
  time_mask: 40
  freq_stripes: 2
  time_stripes: 2
  specaug_p: 1.0
  encoder_ckpt: null

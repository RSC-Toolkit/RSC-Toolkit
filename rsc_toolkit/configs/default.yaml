defaults:
  - model: audioclap
  - data_defaults@data: base
  - data: toy
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adam
  - trainer: default
  # callback choice: ema (default) or none. Disable with `callbacks=none`.
  # must come after trainer to override trainer.params.callbacks.
  - callbacks: ema
  - _self_

seed: 123

run:
  name: ${data.name}-${model.name}
  group: default        # used in outputs/${run.group}/${run.name} of callbacks/best_checkpoint.yaml — null would give 'outputs/None/…', so a default is set
  tags: []

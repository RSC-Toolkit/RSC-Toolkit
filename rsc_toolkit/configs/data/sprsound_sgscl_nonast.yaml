# SFT baselines with the non-AST backbones (ResNet18/34 · EfficientNet-B0 · CNN6) of the SG-SCL repository, extended to the standard SPRSound task (7-class).
# **No paper-reported value** — the ICBHI recipe (16 kHz · 8 s repeat_fade · bs 64 · per-sample normalization · 400 epochs) carried over unchanged.
# With per_sample_stats=true the processor key differs, so the cache does not overlap with the patchmix family.
name: sprsound_sgscl_nonast
params:
  datamodule_name: index
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  time_unit: ms_int
  resample_after_slice: true
  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 64
  num_workers: 8
  shuffle_train: true
  drop_last_train: true
  pin_memory: true
  features:
    enabled: true
    kind: fbank
    cache_dir: downloaded_datasets/features_cache
    n_mels: 128
    target_frames: 798
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: true
    per_sample_stats: true
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 8
  specaugment:
    enabled: false

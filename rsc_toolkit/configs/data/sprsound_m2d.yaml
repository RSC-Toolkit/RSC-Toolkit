# M2D SPRSound fine-tuning data (m2d app/icbhi_sprs eval_sprs.sh): sclmeta waveform preprocessing + dB-mel 80 (400/160, 50–8000 Hz).
name: sprsound_m2d
params:
  datamodule_name: index
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification   # recording_path is relative to Classification/
  index_filename: index_cycle.csv

  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: sclmeta
  fade: false
  resample_after_slice: true
  time_unit: ms_int              # official dataset.py:202 — onset*int(sr/1000)

  train_splits: [train]
  val_splits: [test]
  test_splits: [test]

  batch_size: 64                 # --bs 64 (split_iter 4)
  num_workers: 8
  shuffle_train: true
  drop_last_train: false
  pin_memory: true

  features:
    enabled: true
    kind: sclmeta_mel
    cache_dir: downloaded_datasets/features_cache
    n_mels: 80
    n_fft: 400
    win_length: 400
    hop_length: 160
    f_min: 50.0
    f_max: 8000.0
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

  specaugment:
    enabled: false


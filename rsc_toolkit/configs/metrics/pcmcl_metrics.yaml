# PC-MCL: 학습 배치 라벨이 3-label float 라 train 메트릭 없음. 검증은 모델이 3-sigmoid→4-class one-hot (B,4) 를
# 돌려주므로 기존 ICBHIScore(argmax) 를 그대로 쓴다 (conversion.py 규칙은 모델 안에서 적용).
train: []

val:
  - name: topk_accuracy
    params:
      topk: [1]
  - name: icbhi_score
    params:
      num_classes: 4
      normal_index: 0
      topk: 1

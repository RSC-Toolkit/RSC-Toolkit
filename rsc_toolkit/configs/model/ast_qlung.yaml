# AST of QLung (Interspeech 2026) — faithful port of the official code (verified against goldens).
#   QLung  : model.params.method=aqm (default)  — AngularClassifier(s_a 37) CE + 0.4·CE(DFAM s_d 15)
#   CE     : model.params.method=ce          — keeps the code's CE-path quirk (unnormalized in training / normalized in evaluation) (differs from the original Patch-Mix code)
name: ast_qlung
params:
  n_cls: 4
  method: aqm
  s_a: 37.0
  s_d: 15.0
  kappa: 0.5                     # DFAM m (quality margin coefficient)
  gamma: 0.5
  m_target: 0.2
  lambda_aqm: 0.4                # --alpha
  class_nums: [2063, 1215, 501, 363]   # per-class counts of the official ICBHI train set (4-class) → π_y
  easy_margin: false
  specaug_policy: icbhi_ast_sup  # per-batch SpecAugment of the official train loop (randn gate)
  specaug_mask: mean
  # the toolkit datamodule provides (B, n_mels=128, frames=798)
  input_layout: freq_time
  # the two below are intentionally swapped, replicating an official-code quirk (see the models/ast_patchmix.py docstring)
  input_fdim: 798
  input_tdim: 128

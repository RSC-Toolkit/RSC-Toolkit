# LoRA-RSC 데이터 — 파형 잡음 1D 해석(샘플별 N(0,0.3²)) 변형. 사용: --config-name lorarsc_icbhi data=icbhi_lorarsc_noise
# LoRA-RSC ICBHI 데이터 (dataset/icbhi.py, main_icbhi.py:128-133): cycle 구간을 원 sr 로 잘라 16 kHz 리샘플 → Fade(sr/16) → 8 s 순환 패딩+fade_out
# (= sclmeta 체인) → HF ASTFeatureExtractor(kaldi fbank 128, 10 ms, hanning, dither 0, AudioSet 상수 정규화, max_length 500 절단 = 앞 5 s)
# = 툴킷 fbank(target_frames 500) (골든 tests/golden/lorarsc/features.pt 로 일치 확인).
# [1D 잡음 해석] 파형 잡음(미상, 저자 질문 #6): 공개 코드는 (1,N) 2D 배열에 np.random.randn(len(audio))×0.3 을 더하므로 len=1 → 클립당 스칼라 DC 오프셋이고
#   kaldi remove_dc_offset 로 제거되어 특징이 바뀌지 않는다(골든 toy 4 cycle max|diff| 6.4e-5 = fp32 캐스트 수준). **그러나** 공개 코드는 바로 그
#   (1,N) 호출에서 kaldi AssertionError 로 실행 불가(골든 orig_2d_call ok=False) → 저자 실제 실행은 이 지점에서 공개 코드와 달랐고, 1D 화했다면
#   샘플별 N(0,0.3²) 잡음(train/test 공통, 캐시 1회) 이 된다. 어느 쪽인지 코드로 확정 불가 → 이 기본 config 는 공개 코드 기준(스칼라 = 무효, 잡음 없음),
#   1D 해석은 data=icbhi_lorarsc_noise (rsc_toolkit/datasets/lorarsc_noise.py, 별도 캐시 dir) 로 P1 판정 실패 시 바로 돌릴 수 있다.
# 경계: 원본 metadata.csv 의 onset/offset 은 부동소수 잔재(예 7.2360000000000015) 를 갖고 툴킷 index_cycle.csv 는 .txt 그대로 3자리 —
#   int(t*sr) 절단 시 6898 cycle 중 시작 18건·길이 35건이 최대 1 샘플 차이(fade 1000 샘플 안이라 무시 가능).
# SpecAugment 는 AST 경로에서 미사용. bs 16, drop_last False, 매 epoch 공식 test 평가.
name: icbhi_lorarsc_noise
params:
  datamodule_name: index
  dataset_name: icbhi
  index_dataset_cls: rsc_toolkit.datasets.lorarsc_noise.LoRARSCNoisyIndexDataset   # 샘플별 N(0,0.3²) 잡음, sample_id 결정적(캐시 1회·train/test 공통)
  # 잡음 세기·시드는 생성자 인자로 넘긴다 (기본 0.3 / 10 = 클래스 기본값). 바꾸면 cache_dir 도 함께 바꿀 것.
  # index_dataset_params: {noise_std: 0.3, noise_seed: 10}
  project_root: ${hydra:runtime.cwd}
  split_file: rsc_toolkit/datasets/icbhi/data/official_split.txt   # dataset/metadata.csv split 열과 파일 단위 일치(정찰)
  data_dir: .datasets/icbhi

  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: sclmeta
  fade: false                      # fade 는 pad_type=sclmeta 가 구간에 직접 적용
  resample_after_slice: true       # 원본 get_sample: 구간 로드 후 리샘플

  train_splits: [train]
  val_splits: [test]               # 검증셋 없음 — 매 epoch 공식 test 평가, Score 최고(best-on-test, Se 게이트 없음)
  test_splits: [test]

  batch_size: 16                   # train.yaml batch_size_ICBHI
  num_workers: 8
  shuffle_train: true
  drop_last_train: false           # 원본 drop_last=False (259 step/epoch)
  pin_memory: true

  features:
    enabled: true
    kind: fbank
    cache_dir: downloaded_datasets/features_cache_lorarsc_noise03   # 캐시 키가 processor config 만 보므로 잡음 버전은 별도 dir 필수
    n_mels: 128
    target_frames: 500             # HF max_length=500 절단
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: true
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 8      # 구간 로드·리샘플이 CPU 병목 (캐시 1회)

  specaugment:
    enabled: false                 # 원본 AST 경로 미사용

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rsc-toolkit"
version = "0.1.0"
description = "Respiratory Sound Classification Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "pydantic",
    "librosa",
    "tqdm",
    "platformdirs",

    # Below versions must be compatible with eachother
    "torch==2.7.0",
    "torchaudio==2.7.0", # before torchcodec change
    "torchvision==0.22.0",
    "torchcodec",
]

[project.optional-dependencies]
trainer = [
    "hydra-core",
    "lightning",
]
models = [
    "timm>=0.4.5",
    "transformers",
]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
]

[project.scripts]
rsc-toolkit-train = "rsc_toolkit.train:main"
rsc-toolkit = "rsc_toolkit.cli:main"
rsctk = "rsc_toolkit.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rsc_toolkit*"]

[tool.setuptools.package-data]
rsc_toolkit = ["configs/**/*.yaml", "configs/**/*.yml"]
"rsc_toolkit.datasets.icbhi" = ["data/*.txt"]

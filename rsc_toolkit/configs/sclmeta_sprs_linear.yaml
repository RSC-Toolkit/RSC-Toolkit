# SCL-metadata linear evaluation run: frozen encoder (encoder_ckpt) + Linear, 100 ep, Adam 0.1/wd 1e-4, weighted CE, best test Sc every epoch.
#   rsctk-train --config-name sclmeta_icbhi_linear model.params.encoder_ckpt=outputs/sclmeta/sprs-sclmeta-mscl-pre-s1/final_state.pth run.name=sprs-sclmeta-mscl-s1 seed=1
defaults:
  - model: cnn6_sclmeta
  - data_defaults@data: base
  - data: sprsound_sclmeta
  - loss: cross_entropy            # SPRS uses unweighted CE (main.py:105-106)
  - metrics: sprsound_metrics
  - optimizer: adam_sclmeta_linear
  - trainer: default
  - callbacks: sclmeta_sprs_eval
  - _self_

seed: 1
model:
  params:
    n_cls: 7
    method: linear
    from_sl_official: false

trainer:
  params:
    max_epochs: 100
    precision: 32

run:
  name: sprs-sclmeta-mscl
  group: sclmeta
  tags: [sclmeta, sprsound, linear]

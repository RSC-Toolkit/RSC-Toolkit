# AMS-D SPRSound 확장 — 지표는 표준 7-class(논문 이진 산식은 ICBHI 앵커 전용이라 미사용)
# **논문 목표치 없음** — 논문은 ICBHI 만 실험했다. SPRSound 표준 태스크(2022 inter-patient, 7-class)로 확장한
# 툴킷 자체 관찰이며 재현 판정 대상이 아니다. 레시피는 각 논문의 ICBHI 것을 그대로 쓴다(사용자 결정 2026-08-30).
defaults:
  - model: ast_amsd
  - data_defaults@data: base
  - data: sprsound_amsd
  - loss: cross_entropy
  - metrics: sprsound_metrics
  - optimizer: adam_amsd
  - trainer: default
  - callbacks: amsd_paper_sprs
  - _self_

seed: 1

run:
  name: sprs-amsd
  group: amsd
  tags: [amsd, sprsound, extension]

model:
  params:
    n_cls: 7
    num_train_samples: 6656      # SPRSound 2022 train 이벤트 수 — 기본값(ICBHI 4,142)이면 콜백이 재할당하지만,
                                 # 생성자에서 맞춰 두면 last.ckpt 재개·best.pth 로드가 모양 보정 없이 된다 (REVIEW 09-10 P1)

trainer:
  params:
    max_epochs: 50
    precision: 32

# SCL-metadata main.py:86-93 — Adam (lr 1e-4 AudioSet / 1e-3 scratch, wd 1e-4) + CosineAnnealingLR(T_max=40, eta_min=1e-6) stepped per epoch
# (with T_max 40 the lr oscillates with an 80-epoch period — as in the code)
name: adam
params:
  lr: 1e-4
  weight_decay: 1e-4
lr_scheduler:
  name: cosine_annealing
  params:
    T_max: 40
    eta_min: 1e-6

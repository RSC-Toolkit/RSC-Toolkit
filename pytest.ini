[pytest]
# Restrict collection to this project's tests.
# Without this line pytest walks the whole repository and tries to collect test files from
# copies of the authors' repositories under outputs/reference/ (dass_upstream, opera, etc.),
# which fails with ModuleNotFoundError and aborts collection with "Interrupted: 4 errors during collection".
testpaths = tests
norecursedirs = outputs downloaded_datasets lightning_logs pretrained_models .venv* notebooks .git

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    exact_golden: bit-exact golden comparison; development machine (GPU server) only, excluded in CI with -m "not exact_golden"

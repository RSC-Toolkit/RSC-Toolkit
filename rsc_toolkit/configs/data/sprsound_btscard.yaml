# BTS-CARD SPRSound OOD 평가용 (학습 미사용). 공식 노트북 data/Preprocessing_SPRSound.ipynb cell 5 등가:
#   48 kHz 리샘플 → 녹음 전체 fade in/out(sr/16; IndexDataset fade=true) → event 구간 절단 → 8 s repeat 패딩 + fade_out
#   (pad_type repeat_fade) → ClapProcessor log-mel (1, 1001, 64).
# 기존 data/sprsound.yaml(pad_type repeat, fade_out 없음)과 다르므로 피처 캐시도 분리한다(캐시 키는 프로세서 설정만 포함).
# 4-class 병합·meta3·문장은 rsc_toolkit/datasets/sprsound_ood.py 가 이 데이터모듈의 test 셋 위에서 만든다.
name: index
params:
  datamodule_name: index

  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification   # recording_path 는 Classification/ 기준 상대경로
  index_filename: index_cycle.csv

  sampling_rate: 48000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade
  fade: true

  train_splits: [train]
  val_splits: [test]
  test_splits: [test]          # SPRSound 2022 inter-patient test = 논문의 'valid' OOD 셋 (1,429 events)

  batch_size: 8
  num_workers: 4
  shuffle_train: false

  features:
    enabled: true
    kind: clap
    cache_dir: downloaded_datasets/features_cache_btscard
    clap_model_name: laion/clap-htsat-unfused

  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

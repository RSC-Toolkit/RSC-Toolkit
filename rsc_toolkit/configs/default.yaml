defaults:
  - model: audioclap
  - data_defaults@data: base
  - data: toy
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adam
  - trainer: default
  # 콜백 선택: ema(기본) 또는 none. `callbacks=none` 으로 끌 수 있다.
  # trainer 뒤에 와야 trainer.params.callbacks 를 덮어쓴다.
  - callbacks: ema
  - _self_

seed: 123

run:
  name: ${data.name}-${model.name}
  group: default        # callbacks/best_checkpoint.yaml 의 outputs/${run.group}/${run.name} 에 쓰인다 — null 이면 'outputs/None/…' 이 되므로 기본값을 둔다
  tags: []

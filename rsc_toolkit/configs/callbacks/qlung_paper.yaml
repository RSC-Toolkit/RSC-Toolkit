# @package _global_
# QLung training-protocol callbacks (scripts/train_qlung_icbhi.sh + train_qlung.py):
#   - 0.6:0.4 live average with the pre-iteration weights at every iteration (--ma_update --ma_beta 0.6) — excluding DFAM (dfam.*) (train_qlung.py:490-499)
#   - per-epoch cosine LR (eta_min = lr * 0.1^3), no warmup (util/misc.py:12-24)
#   - best-on-test selection: save when Score is best && Se > 5 (train_qlung.py:574-577)
trainer:
  params:
    callbacks:
      - _target_: rsc_toolkit.trainer.callbacks.qlung_ma_update.LiveWeightAveragingExcluding
        beta: 0.6
        exclude_prefixes: ["dfam."]
      - _target_: rsc_toolkit.trainer.callbacks.paper_cosine_lr.PaperCosineLR
        learning_rate: ${optimizer.params.lr}        # single source: the optimizer group (a hard-coded copy would silently ignore CLI sweeps)
        epochs: ${trainer.params.max_epochs}
      - _target_: rsc_toolkit.trainer.callbacks.icbhi_best_checkpoint.ICBHIBestScoreCheckpoint
        dirpath: outputs/qlung/${run.name}
        min_se: 5.0
      # per-epoch last.ckpt for resuming after an external interruption (deleted on normal completion)
      - _target_: rsc_toolkit.trainer.callbacks.resume_checkpoint.EpochResumeCheckpoint
        dirpath: outputs/qlung/${run.name}

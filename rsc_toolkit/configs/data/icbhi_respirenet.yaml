# RespireNet 데이터: librosa 4 kHz(kaiser_best) → cycle → 8초 청킹(자기 반복 패딩, seed) → magma 이미지(BRC) → Normalize.
#   80/20 환자 fold (원본·배포 ckpt 기준): split_mode=fold, test_fold=4
#   ICBHI 공식 60/40 (툴킷 표준, 원본에 코드 없음): data.params.split_mode=official
# mean/std: null 이면 학습셋(증강 켠 상태, seed)에서 계산 (원본 get_mean_and_std) — 평가 전용이면 eval.py 상수 사용.
name: icbhi_respirenet
params:
  datamodule_name: respirenet
  data_dir: .datasets/icbhi
  split_mode: fold
  test_fold: 4
  folds_file: rsc_toolkit/datasets/icbhi/data/patient_list_foldwise.txt
  official_split_file: rsc_toolkit/datasets/icbhi/data/official_split.txt
  sample_rate: 4000
  desired_length: 8.0
  res_type: kaiser_best
  pad_seed: 0
  augment: true                # nlpaug 5종(p .5) + roll(p .5), 학습만
  aug_seed: 0
  mean: null                   # → 학습셋에서 계산
  std: null
  batch_size: 64
  num_workers: 8
  weighted_sampler: true       # WeightedRandomSampler(1/class_prob) — train.py:114-118

# BTS-CARD 를 **SPRSound 로 직접 학습**할 때 쓰는 데이터 설정 (SPR→SPR, 7-class).
#
# 기존 sprsound_btscard.yaml 과 다른 파일이다 — 그쪽은 ICBHI 학습 ckpt 를 SPRSound 에 얹는
# **제로샷 OOD 평가 뷰**(7→4 병합, sprsound_ood.py 가 자체 절단)이고, 이 config 는 SPRSound 를 학습한다.
#   · datamodule_name: btscard_sprs  → meta7 모양 벡터를 **train·val 양쪽** 배치에 붙인다
#     (기본 index 경로는 val 에 meta 를 안 붙여서 BTS 계열이 validation_step 에서 죽는다 — sprs-bts-s1/s2 EXIT=1 의 원인)
#   · label_map 없음 → 7-class 원 라벨
#   · shuffle_train/drop_last_train 켜짐 (ICBHI 원본 train loader 와 동일)
#
# 오디오·특징 체인은 sprsound_bts.yaml 과 같다 (48 kHz → 녹음 fade → 구간 절단 → 8 s repeat+fade_out → CLAP log-mel 1001×64).
# 이 체인이 저자 배포 텐서와 일치함은 ICBHI 에서 확인했다(data/bts_precomputed.yaml 주석).
# 캐시도 sprsound_bts 와 같은 것을 쓴다 — time_unit·패딩·샘플링레이트가 전부 같아 같은 파형이 나온다.
name: sprsound_btscard_train
params:
  datamodule_name: btscard_sprs

  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv

  sampling_rate: 48000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade
  fade: true
  time_unit: ms_int

  train_splits: [train]
  val_splits: [test]             # best-on-test — 다른 30행과 같은 프로토콜
  test_splits: [test]

  batch_size: 8
  num_workers: 8
  shuffle_train: true
  drop_last_train: true          # ICBHI 원본 train loader drop_last=True
  pin_memory: true

  features:
    enabled: true
    kind: clap
    cache_dir: downloaded_datasets/features_cache_bts_sprs   # sprsound_bts 와 동일 체인 → 캐시 공유
    clap_model_name: laion/clap-htsat-unfused

  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

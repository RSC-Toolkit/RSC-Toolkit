# QLung (Audio-CLAP) reproduction run config — the second backbone variant in paper Tables 1·2.
#
# Paper-reported: ICBHI 81.98 / 44.81 / 63.39±0.40 · SPRSound OOD 74.71 / 44.88 / 59.80±3.51
#            (+1.38 / +1.57 over the AST version, respectively — in the paper this variant is better)
#
# **Grade C (re-implementation from the specification).** The authors' repository has no Audio-CLAP backbone code, so it is reconstructed
# from the paper description + the method part of the AST code. See the models/clap_qlung.py docstring for the 3 assumptions.
#
#   QLung (Audio-CLAP) : rsctk-train --config-name qlung_clap_icbhi seed=N run.name=icbhi-qlung-clap-sN
#   Baseline (CE)      : ... model.params.method=ce run.name=icbhi-qlung-clap-ce-sN
#     └ Audio-CLAP linear head on the same data path → measures the (method − baseline) gain.
#       For reference, plain Audio-CLAP with the authors' released .pt (bts_icbhi model.name=audioclap) gives 62.76±1.15.
#
# Loss and optimization are the same as the AST version (unweighted CE, adam 5e-5/wd 1e-6, cosine, MA 0.6, 50 ep, bs 8, AMP).
defaults:
  - model: clap_qlung
  - data_defaults@data: base
  - data: icbhi_qlung_clap
  - loss: cross_entropy        # unweighted CE (criterion[0])
  - metrics: icbhi_metrics
  - optimizer: adam            # lr 5e-5, wd 1e-6
  - trainer: default           # max_epochs 50
  - callbacks: qlung_paper     # MA 0.6 (excluding dfam) · PaperCosineLR · best-on-test (Se>5) · last.ckpt for resuming
  - _self_

seed: 1

trainer:
  params:
    precision: 16-mixed        # official AMP

run:
  name: icbhi-qlung-clap
  group: qlung
  tags: [qlung, clap, icbhi, grade-c]

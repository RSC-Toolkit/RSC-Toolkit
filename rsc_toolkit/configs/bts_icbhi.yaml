# bts 계열 재현 실행 config (공식 스크립트: 50ep, bs8, adam 5e-5/wd 1e-6, cosine, MA 0.5, 비가중 CE, AMP).
#
#   BTS (meta all): rsctk-train --config-name bts_icbhi run.name=icbhi-bts-s1 seed=1
#   Audio-CLAP    : ... model=audioclap run.name=icbhi-audioclap-s1 seed=1
#
# 데이터는 저자 배포 training.pt/test.pt (data_defaults 의 오디오 전처리 인자는 여기 해당 없음).
defaults:
  - model: bts
  - data: bts_precomputed
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adam            # lr 5e-5, wd 1e-6
  - trainer: default           # max_epochs 50
  - callbacks: bts_paper
  - _self_

seed: 1

trainer:
  params:
    precision: 16-mixed        # 원본 AMP(GradScaler+autocast)

run:
  name: icbhi-bts
  group: bts
  tags: [bts, icbhi]

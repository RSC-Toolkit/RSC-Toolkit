# QLung (Audio-CLAP) SPRSound data config — trained and evaluated directly on the standard SPRSound task (2022 inter-patient, 7-class) (SPR→SPR).
#
# Combines the CLAP path of icbhi_qlung_clap.yaml (48 kHz → 8 s repeat_fade → ClapProcessor log-mel (1, 1001, 64), AQS from the 48 kHz waveform)
# with the dataset arguments of sprsound_qlung.yaml (under Classification/, index_cycle.csv, whole-recording resampling then slicing, time_unit s).
# No paper-reported value (the QLung paper uses SPRSound only for OOD) → not a reproduction target but a **toolkit extension (no paper counterpart)**.
# The feature and AQS caches are separate from the AST version (sprsound_qlung) and the ICBHI CLAP version — the chain (48 kHz, time_unit s) differs.
name: sprsound_qlung_clap
params:
  datamodule_name: qlung
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.qlung_data.QLungAQSIndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification   # recording_path is relative to Classification/
  index_filename: index_cycle.csv
  sampling_rate: 48000           # CLAP path (16000 in the AST version)
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade          # same as the official BTS/Audio-CLAP preprocessing
  fade: true
  resample_after_slice: false    # resample the whole recording to 48 kHz, then slice segments (same rule as sprsound_qlung)
  time_unit: s
  train_splits: [train]
  val_splits: [test]             # best-on-test — same protocol as the other rows
  test_splits: [test]
  batch_size: 8
  num_workers: 8
  shuffle_train: true
  drop_last_train: true          # official train loader uses drop_last=True
  pin_memory: true
  features:
    enabled: true
    kind: clap
    cache_dir: downloaded_datasets/features_cache_qlung_clap_sprs
    clap_model_name: laion/clap-htsat-unfused
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0
  specaugment:
    enabled: false               # the CLAP path has no per-batch SpecAugment of the official AST path
  qlung:
    alpha: 0.7                   # --quality_alpha
    beta: 0.3                    # --quality_beta
    entropy_source: rms          # same interpretation as the AST version's main result (code as is, including the bug that passes rms twice)
    formula: code
    cache_dir: downloaded_datasets/aqs_cache_clap48k_sprs   # based on the 48 kHz waveform · SPRSound only
    precompute: true
    precompute_num_workers: 8
    attach_val: true

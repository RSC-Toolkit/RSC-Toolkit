# LoRA-RSC(ICASSP 2025) ICBHI 4-class — 공식 코드 기본값: LoRA K,V r=8 α=8(scaling 8/96), 100ep, bs16, AdamW 0.01/wd 0.1 (β .9/.98, eps 1e-6),
#   스텝 코사인, 비가중 CE, fp32, 증강 없음, best-on-test(Se 게이트 없음). 앵커(README 표, run 수 미상, 코드 seed 10): Sp 85.31 / Se 36.11 / Score 60.71.
#   full-FT 기준선(README 82.84/36.70/59.77): model.params.method=full_ft optimizer.params.lr=5e-5
#   실행: rsctk-train --config-name lorarsc_icbhi run.name=icbhi-lorarsc-s1 seed=1
defaults:
  - model: ast_lora_rsc
  - data_defaults@data: base
  - data: icbhi_lorarsc
  - loss: cross_entropy         # main_icbhi.py:195 비가중 CE (가중치는 주석 처리)
  - metrics: icbhi_metrics
  - optimizer: adamw_lorarsc
  - trainer: default
  - callbacks: lorarsc_paper
  - _self_

seed: 1

trainer:
  params:
    max_epochs: 100
    precision: 32

run:
  name: icbhi-lorarsc
  group: lorarsc
  tags: [lorarsc, icbhi]

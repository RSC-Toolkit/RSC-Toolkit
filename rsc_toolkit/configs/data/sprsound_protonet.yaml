# Prototype 를 SPRSound 표준 태스크(7-class)로 확장. ICBHI 레시피 그대로:
# 4 kHz 리샘플 → Butterworth 밴드패스 100–1800 Hz(녹음 전체) → 이벤트 분할 → 4 s 랜덤(train)/센터(eval) 크롭·wrap 패딩.
# 모델이 torchlibrosa 로 log-mel 을 직접 계산하므로 파형을 그대로 넘긴다.
name: sprsound_protonet
params:
  datamodule_name: protonet
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  sampling_rate: 4000
  sample_level: cycle
  desired_length_sec: null
  fade: false
  bandpass: true
  cycle_len: 16000
  time_unit: ms_int
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 16
  num_workers: 8
  shuffle_train: true
  drop_last_train: false
  pin_memory: true
  features:
    enabled: true
    kind: waveform
  feature_precompute: false
  specaugment:
    enabled: false

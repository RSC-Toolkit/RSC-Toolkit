# Prototype SPRSound extension
# **No paper-reported value** — the paper evaluates ICBHI only. This extends it to the standard SPRSound task (2022 inter-patient, 7-class)
# as a toolkit extension (no paper counterpart), not a reproduction target. The recipe is the paper's ICBHI recipe, unchanged.
defaults:
  - model: protonet
  - data_defaults@data: base
  - data: sprsound_protonet
  - loss: cross_entropy
  - metrics: sprsound_metrics
  - optimizer: adam_protonet
  - trainer: default
  - callbacks: protonet_paper
  - _self_

seed: 1

run:
  name: sprs-protonet
  group: protonet
  tags: [protonet, sprsound, extension]

model:
  params:
    n_cls: 7

trainer:
  params:
    max_epochs: -1
    max_steps: 10000             # same official ITERATION_MAX as ICBHI
    precision: 32
    val_check_interval: 500
    check_val_every_n_epoch: null

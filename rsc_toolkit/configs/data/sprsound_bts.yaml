# BTS / Audio-CLAP 를 SPRSound 표준 태스크(7-class)로 확장할 때 쓰는 데이터 설정.
# ICBHI 는 저자 배포 텐서(bts_precomputed)를 읽지만 SPRSound 배포본은 없으므로 **툴킷 파이프라인으로 같은 특징을 만든다**
# (48 kHz → 녹음 fade → 구간 절단 → 8 s repeat+fade_out → ClapProcessor log-mel 1001×64).
# 이 체인이 저자 텐서와 비트 단위로 일치함은 ICBHI 에서 이미 확인했다(data/bts_precomputed.yaml 주석).
# 캐시는 **분리한다** — BTS-CARD OOD 는 sprsound_ood.py 가 자체 ms 반올림으로 구간을 자르는데(time_unit 미설정),
# 이 config 는 datamodule 의 time_unit=ms_int 를 쓴다. 프로세서 설정이 같아 캐시 키가 겹치므로 dir 를 나눠야 한다.
name: sprsound_bts
params:
  datamodule_name: index
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  sampling_rate: 48000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade
  fade: true
  time_unit: ms_int
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 8
  num_workers: 8
  shuffle_train: true
  drop_last_train: true          # ICBHI 원본 train loader drop_last=True
  pin_memory: true
  features:
    enabled: true
    kind: clap
    cache_dir: downloaded_datasets/features_cache_bts_sprs   # btscard OOD 와 time_unit 이 달라 캐시를 분리한다(같이 쓰면 조용히 섞인다)
    clap_model_name: laion/clap-htsat-unfused
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

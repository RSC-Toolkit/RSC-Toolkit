# @package _global_
# SPRSound 확장 공통 평가 프로토콜 — **M2D 의 SPRS 방식**(configs/callbacks/m2d_sprs_eval.yaml)을 그대로 따른다.
#   매 epoch test Score 최고(strict >, Se 게이트 없음) + 재개 지원. **MA(가중치 이동평균)는 쓰지 않는다**
#   (patch-mix 계열 ICBHI 레시피의 --ma_update 0.5 는 M2D SPRS 프로토콜에 없음).
trainer:
  params:
    callbacks:
      - _target_: rsc_toolkit.trainer.callbacks.icbhi_best_checkpoint.ICBHIBestScoreCheckpoint
        dirpath: outputs/sprsext/${run.name}
        min_se: -1.0
      - _target_: rsc_toolkit.trainer.callbacks.resume_checkpoint.EpochResumeCheckpoint
        dirpath: outputs/sprsext/${run.name}

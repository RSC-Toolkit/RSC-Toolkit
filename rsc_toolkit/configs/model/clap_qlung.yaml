# Variant that places the QLung method on the Audio-CLAP backbone (second row of paper Tables 1·2).
#   method=aqm (default) — AngularClassifier(s_a 37) CE + 0.4·CE(DFAM s_d 15)
#   method=ce        — Audio-CLAP linear head on the same data path (baseline for measuring the gain)
# Hyperparameters are copied from the authors' AST code — the paper does not give separate values for the CLAP version (assumption ① in models/clap_qlung.py).
name: clap_qlung
params:
  n_cls: 4
  method: aqm
  pretrained_name: laion/clap-htsat-unfused
  final_feat_dim: 512            # CLAP audio_embeds dimension (same as models/clap.py)
  s_a: 37.0
  s_d: 15.0
  kappa: 0.5                     # DFAM m (quality margin coefficient)
  gamma: 0.5
  m_target: 0.2
  lambda_aqm: 0.4                # --alpha
  class_nums: [2063, 1215, 501, 363]   # per-class counts of the official ICBHI train set (4-class) → π_y
  easy_margin: false

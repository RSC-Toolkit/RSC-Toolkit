# @package _global_
# Lungmix 학습 프로토콜 콜백: best = 툴킷 best-on-test(Score 최고, Se 게이트 없음 — 논문의 COMB(HF 포함) 기준 선택은 범위 밖이라 불가).
# cosine annealing 은 optimizer/adamw_lungmix.yaml 의 lr_scheduler(epoch 단위) 로 처리.
trainer:
  params:
    callbacks:
      - _target_: rsc_toolkit.trainer.callbacks.icbhi_best_checkpoint.ICBHIBestScoreCheckpoint
        dirpath: outputs/lungmix/${run.name}
        min_se: -1.0
      - _target_: rsc_toolkit.trainer.callbacks.resume_checkpoint.EpochResumeCheckpoint
        dirpath: outputs/lungmix/${run.name}

# Full fine-tuning of OPERA-CT, SPRSound 7-class — toolkit standard task (no target value). The EMBC SPRS recipe with freeze_body off, lr 5e-6 (the M2D SPRS value) and bs 64.
#   Run: rsctk-train --config-name opera_ft_sprs run.name=sprs-operact-ft-s1 seed=1
defaults:
  - model: opera_ct
  - data_defaults@data: base
  - data: sprsound_opera
  - loss: cross_entropy
  - metrics: sprsound_metrics
  - optimizer: adam_m2d
  - trainer: default
  - callbacks: opera_eval
  - _self_

seed: 1

model:
  params:
    n_cls: 7
    freeze_body: false

data:
  params:
    batch_size: 64

optimizer:
  params:
    lr: 5e-6

trainer:
  params:
    max_epochs: 50
    precision: 32

run:
  name: sprs-operact-ft
  group: opera
  tags: [opera, sprsound, finetune]

# QLung (Audio-CLAP) 의 ICBHI 데이터 설정.
#
# AST 판(icbhi_qlung.yaml)과 두 가지가 다르다:
#   ① 특징이 fbank 128×798 이 아니라 **CLAP log-mel (1, 1001, 64)** 이다 → 48 kHz 경로.
#   ② 그래서 **AQS 도 48 kHz 파형에서 계산**된다(AST 판은 16 kHz). 논문이 AQS 계산의 샘플링레이트를
#      밝히지 않아 "백본에 들어가는 파형에서 계산한다" 는 자연스러운 해석을 따랐다 — 가정 ③.
#      캐시를 AST 판과 분리하는 이유이기도 하다.
#
# 오디오 체인은 Audio-CLAP·BTS 기준선과 같다(48 kHz → 8 s repeat_fade → ClapProcessor log-mel).
# 저자 배포 .pt(bts_precomputed)를 안 쓰고 툴킷 파이프라인으로 만드는 이유는 **AQS 에 파형이 필요**하기
# 때문이다. 이 체인이 저자 텐서와 비트 단위로 일치함은 ICBHI 에서 이미 확인했다
# (configs/data/bts_precomputed.yaml 주석).
name: icbhi_qlung_clap
params:
  datamodule_name: qlung

  dataset_name: icbhi
  index_dataset_cls: rsc_toolkit.datasets.qlung_data.QLungAQSIndexDataset
  project_root: ${hydra:runtime.cwd}
  split_file: rsc_toolkit/datasets/icbhi/data/official_split.txt
  data_dir: .datasets/icbhi

  sampling_rate: 48000           # CLAP 경로 (AST 판은 16000)
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade          # BTS/Audio-CLAP 원본 전처리와 동일
  fade: true

  train_splits: [train]
  val_splits: [test]             # best-on-test — 다른 행과 동일 프로토콜
  test_splits: [test]

  batch_size: 8
  num_workers: 8
  shuffle_train: true
  drop_last_train: true          # 원본 train loader drop_last=True
  pin_memory: true

  features:
    enabled: true
    kind: clap
    # AST 판(features_cache)·BTS 계열과 캐시를 분리한다 — 오디오 체인이 캐시 키에 안 들어가므로
    # 이름으로 갈라 두지 않으면 조용히 남의 피처를 읽는다(실제로 PC-MCL SPRS 에서 사고가 났다).
    cache_dir: downloaded_datasets/features_cache_qlung_clap
    clap_model_name: laion/clap-htsat-unfused

  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

  specaugment:
    enabled: false               # CLAP 경로에는 원본 AST 의 배치 SpecAugment 가 없다

  qlung:
    alpha: 0.7                   # --quality_alpha
    beta: 0.3                    # --quality_beta
    entropy_source: rms          # AST 판 주 결과와 같은 해석(코드 그대로 = rms 중복 전달 버그 포함)
    formula: code
    cache_dir: downloaded_datasets/aqs_cache_clap48k   # 48 kHz 파형 기준이라 AST 판과 분리
    precompute: true
    precompute_num_workers: 8
    attach_val: true

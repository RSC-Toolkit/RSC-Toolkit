defaults:
  - model: audioclap
  - data_defaults@data: base
  - data: toy
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adam
  - trainer: default
  # 콜백 선택: ema(기본) 또는 none. `callbacks=none` 으로 끌 수 있다.
  # trainer 뒤에 와야 trainer.params.callbacks 를 덮어쓴다.
  - callbacks: ema
  - _self_

seed: 123

run:
  name: ${data.name}-${model.name}
  group: null
  tags: []

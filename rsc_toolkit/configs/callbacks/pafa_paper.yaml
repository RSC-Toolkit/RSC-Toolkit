# @package _global_
# PAFA 논문 학습 프로토콜 콜백: MA 0.5, cosine(lr 5e-5, 100 ep), best-on-test — 단 Se 게이트가 0.1 (main.py:518)
trainer:
  params:
    callbacks:
      - _target_: rsc_toolkit.trainer.callbacks.ma_update.LiveWeightAveraging
        beta: 0.5
      - _target_: rsc_toolkit.trainer.callbacks.paper_cosine_lr.PaperCosineLR
        learning_rate: ${optimizer.params.lr}        # 단일 출처 — optimizer 그룹. 하드코딩 복사본이 CLI 스윕을 침묵 무효화했다
        epochs: ${trainer.params.max_epochs}
      - _target_: rsc_toolkit.trainer.callbacks.icbhi_best_checkpoint.ICBHIBestScoreCheckpoint
        dirpath: outputs/pafa/${run.name}
        min_se: 0.1
      - _target_: rsc_toolkit.trainer.callbacks.resume_checkpoint.EpochResumeCheckpoint
        dirpath: outputs/pafa/${run.name}

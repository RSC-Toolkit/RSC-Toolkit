# sgscl 저장소 비-AST(ResNet18/34, EffNet-B0, CNN6) 레시피의 ICBHI 데이터 설정.
# AST 계열과의 차이:
#   - fbank 정규화가 샘플별 mean/std (원본 generate_fbank 의 비-AST 분기) → 캐시 키 분리
#   - batch 64 (repo 스크립트 other_architectures/*_ce.sh)
# SpecAugment 는 모델이 배치 단위로 적용, meta 라벨은 ce 에선 무시되므로 공용으로 켠다.
name: icbhi_sgscl_nonast
params:
  datamodule_name: index

  dataset_name: icbhi
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  split_file: rsc_toolkit/datasets/icbhi/data/official_split.txt
  data_dir: .datasets/icbhi

  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade          # 원본 cut_pad_sample_torchaudio (fade_out 포함)

  train_splits: [train]
  val_splits: [test]             # 논문 프로토콜: 매 epoch 공식 test 평가 (best-on-test)
  test_splits: [test]

  batch_size: 64
  num_workers: 8
  shuffle_train: true
  drop_last_train: true          # 원본 train loader drop_last=True
  pin_memory: true

  features:
    enabled: true
    kind: fbank
    cache_dir: downloaded_datasets/features_cache
    n_mels: 128
    target_frames: 798
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: true
    per_sample_stats: true       # 비-AST 분기: (fbank - mean) / (std * 2)

  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

  specaugment:
    enabled: false               # 모델이 배치 단위로 적용한다

  meta_label_mode: dev

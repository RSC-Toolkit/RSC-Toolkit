# GaP-Aug (Chang et al., ICASSP 2024) reproduction — **re-implementation from the paper specification (assumption run)** (no official or unofficial code, grade C).
#   CNN14 (AudioSet 16k) + GaP-aug + Mixup + NLL + triplet (Algo. 1 unweighted sum; model.params.w_trip=0.01 is a deviation flag following the sister paper), 20,000 iter (=40 epochs × 500 steps), bs 16 balanced batches, Adam 1e-5, no AMP.
#   Paper-reported values (official 60/40 split, single values): Table 1 GaP-aug+Mixup Se 58.20 / Sp 77.07 / Score 67.64 (Acc 69.01); Table 2 Naïve 48.34/64.28/56.31,
#   GaP-aug w/o Mixup 56.49/76.94/66.72, SpecAug w/ Mixup 48.63/79.54/64.09, PatchMask w/ Mixup 54.88/77.01/65.94, Mixup 55.88/71.82/63.85.
#   Run: rsctk-train --config-name gapaug_icbhi run.name=icbhi-gapaug-s1 seed=1
#   Variants: model.params.method=naive|gapaug_nomixup|specaug|patchmask|mixup_only  (model.params.mixup=false for w/o Mixup)
#   Assumption flags: see the comments in configs/model/cnn14_gapaug.yaml.
defaults:
  - model: cnn14_gapaug
  - data_defaults@data: base
  - data: icbhi_gapaug
  - loss: cross_entropy        # evaluation loss (and the NLL of naive); the training loss is computed inside the model (NLL+triplet)
  - metrics: icbhi_metrics
  - optimizer: adam_gapaug
  - trainer: default
  - callbacks: gapaug_paper
  - _self_

seed: 1

trainer:
  params:
    max_epochs: 40             # 40 × 500 step
    max_steps: 20000           # paper: 20,000 iterations
    precision: 32              # AMP not mentioned

run:
  name: icbhi-gapaug
  group: gapaug
  tags: [gapaug, cnn14, icbhi]

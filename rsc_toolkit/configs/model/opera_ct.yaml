# OPERA-CT(HTSAT-Swin, evelyn0414/OPERA) 분류 모델 — EMBC'25 동결 평가 경로(eval-audio-repr app/icbhi_sprs solve.py) 재현.
#   freeze_body true = EMBC --freeze_body (백본 동결, Tfm 헤드만 학습; ICBHI 4-class 48.97±1.21 / SPRS 7-class 71.62±0.84 앵커)
#   freeze_body false = 툴킷 표준 태스크 전체 미세조정 (논문 목표치 없음)
name: opera_ct
params:
  n_cls: 4
  pretrained_path: pretrained_models/upstream/opera/encoder-operaCT.ckpt
  freeze_body: true
  head: tfm                      # tfm(depth 4, heads 1, mlp_ratio 1) | mlp(768-128-n_cls)
  head_depth: 4
  head_heads: 1
  head_mlp_ratio: 1
  freq_mask: 20                  # scl args 기본 (evar SpecAugment, 배치 공유 마스크)
  time_mask: 40
  input_sec: 8.0
  sample_rate: 16000
  drop_path_rate: 0.1

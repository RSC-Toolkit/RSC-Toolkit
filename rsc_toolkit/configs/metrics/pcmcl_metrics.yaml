# PC-MCL: train batch labels are 3-label floats, so there are no train metrics. For validation the model returns 3-sigmoid → 4-class one-hot (B,4),
# so the existing ICBHIScore (argmax) is used as is (the conversion.py rules are applied inside the model).
train: []

val:
  - name: topk_accuracy
    params:
      topk: [1]
  - name: icbhi_score
    params:
      num_classes: 4
      normal_index: 0
      topk: 1

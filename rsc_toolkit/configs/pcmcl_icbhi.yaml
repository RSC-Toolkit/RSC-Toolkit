# PC-MCL (arXiv 2601.17080, wa976/PC-MCL) BEATs main result — official ICBHI 60/40 split, 4-class. Paper-reported (5 seeds): 79.04/51.71/65.37±0.73.
# Hyperparameters: no training script (.gitignore /scripts) → values stated in the paper (10 s, α↔w 0.1, mixing_prob 1.0, threshold 0.5, hard negative)
#   + **assumptions (not confirmed by the authors)** from the PAFA lineage (100 ep, bs 32, Adam 5e-5/wd 1e-6, cosine, MA 0.5, nospec, seeds 1-5). Results are labeled as an 'assumption run'.
#   argparse defaults (for reference): 400 ep / lr 1e-3 / wd 1e-4 / 8 s / mixing_prob 0.5 / ssl_prob 0.3 / ssl_weight 0.5 / ma_beta 0.
# No AMP (no autocast in main.py) → precision 32. cudnn.deterministic=True is not reproduced (toolkit convention).
#   Run: rsctk-train --config-name pcmcl_icbhi run.name=icbhi-pcmcl-beats-s1 seed=1
defaults:
  - model: beats_pcmcl
  - data_defaults@data: base
  - data: icbhi_pcmcl_beats
  - loss: bce_with_logits
  - metrics: pcmcl_metrics
  - optimizer: adam_pcmcl
  - trainer: default
  - callbacks: pcmcl_paper
  - _self_

seed: 1

trainer:
  params:
    max_epochs: 100
    precision: 32

run:
  name: icbhi-pcmcl-beats
  group: pcmcl
  tags: [pcmcl, beats, icbhi]

# PC-MCL (arXiv 2601.17080) AST — ICBHI 공식 60/40 4-class. 앵커(5 seed): 78.54/46.05/62.30±0.50.
# 하이퍼파라미터는 pcmcl_icbhi.yaml 과 같은 가정(PAFA 계보 100 ep/bs 32/Adam 5e-5/cosine/MA 0.5). SpecAugment 는 코드 기본(on) 유지,
# AST forward 만 fp16 autocast(무 GradScaler) → trainer precision 32.
#   실행: rsctk-train --config-name pcmcl_ast_icbhi run.name=icbhi-pcmcl-ast-s1 seed=1
defaults:
  - model: ast_pcmcl
  - data_defaults@data: base
  - data: icbhi_pcmcl_ast
  - loss: bce_with_logits
  - metrics: pcmcl_metrics
  - optimizer: adam_pcmcl
  - trainer: default
  - callbacks: pcmcl_paper
  - _self_

seed: 1

trainer:
  params:
    max_epochs: 100
    precision: 32

run:
  name: icbhi-pcmcl-ast
  group: pcmcl
  tags: [pcmcl, ast, icbhi]

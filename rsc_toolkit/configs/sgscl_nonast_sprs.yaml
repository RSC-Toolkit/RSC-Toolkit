# SG-SCL 저장소의 비-AST SFT 기준선 4종을 SPRSound 표준 태스크(7-class)로 확장.
#   rsctk-train --config-name sgscl_nonast_sprs model.name=resnet18_sft   seed=N run.name=sprs-resnet18-ce-sN
#   ... model.name=resnet34_sft | efficientnet_b0_sft | cnn6_sft
# **논문 목표치 없음** — 논문은 ICBHI 만 실험했다. 각 논문의 ICBHI 레시피를 그대로 쓴다(사용자 결정 2026-08-30).
# ICBHI 가 가중 CE 이므로 SPRS 도 같은 산식의 가중 CE 를 SPRSound 분포로 계산해 쓴다.
defaults:
  - model: sft_backbone
  - data_defaults@data: base
  - data: sprsound_sgscl_nonast
  - loss: cross_entropy_weighted_sprsound
  - metrics: sprsound_metrics
  - optimizer: adam
  - trainer: default
  - callbacks: sgscl_nonast_paper
  - _self_

seed: 1

trainer:
  params:
    max_epochs: 400
    precision: 16-mixed

optimizer:
  params:
    lr: 1e-3                   # 스크립트 --learning_rate 1e-3 — icbhi 변형과 동일.
                               # 이전에는 이 override 가 빠져 optimizer 그룹은 5e-5 를 말하는데
                               # PaperCosineLR 콜백이 1e-3 으로 덮어써 실효 lr 은 1e-3 이었다
                               # (기존 run 의 수치는 그대로 유효 — 메타데이터만 거짓이었다).

run:
  name: sprs-nonast-sft
  group: sgscl
  tags: [sgscl, sprsound, extension]

model:
  params:
    n_cls: 7

[build-system]
# `license = "MIT"`(PEP 639 SPDX 문자열)·`license-files` 는 setuptools 77 부터 인정된다 —
# 그 아래 버전으로 --no-build-isolation 빌드하면 "project.license must be valid exactly by one definition" 로 실패한다.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rsc-toolkit"
version = "0.1.0"
description = "Respiratory Sound Classification Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "pydantic",
    "librosa",
    "tqdm",
    "platformdirs",
    "pandas",

    # Below versions must be compatible with eachother
    "torch==2.7.0",
    "torchaudio==2.7.0", # before torchcodec change
    "torchvision==0.22.0",
    "torchcodec",
]

[project.optional-dependencies]
trainer = [
    "hydra-core",
    "lightning",
    "tensorboard",
]
models = [
    "timm>=0.4.5",
    "transformers",
    # RespireNet 특징 파이프라인 (cv2 resize/컬러 변환, librosa kaiser_best 리샘플)
    "opencv-python-headless",
    "resampy",
    # Prototype(protonet) 의 log-mel 프런트엔드. models/protonet.py:43 에서 모듈 최상단 import 라
    # 없으면 모델 등록 자체가 조용히 건너뛰어진다(ModelFactory.register_models 가 ImportError 를 경고로 삼킨다).
    "torchlibrosa",
]
# ResNet50 SimCLR(SSL) 가중치를 쓸 때만 필요하다.
# models/backbone/resnet.py:129-133 이 함수 안에서 지연 import 하고 없으면 RuntimeError 로 안내하므로
# 다른 경로에는 영향이 없다 — 그래서 models 가 아니라 별도 extra 로 둔다.
ssl-weights = [
    "lightning-bolts",
]
# 튜토리얼 노트북(notebooks/tutorial.ipynb) 실행·CI 검증용.
notebook = [
    "jupyter",
    "nbconvert",
    "nbformat",
    "ipykernel",
]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
]

[project.scripts]
rsc-toolkit-train = "rsc_toolkit.train:main"
rsc-toolkit-eval = "rsc_toolkit.evaluate:main"
rsc-toolkit = "rsc_toolkit.cli:main"
rsctk = "rsc_toolkit.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rsc_toolkit*"]

[tool.setuptools.package-data]
# 런타임 코드가 읽는 번들 데이터. 글롭은 각 패키지 디렉토리 기준 상대 경로다.
# (tests/unit/test_packaging.py 가 이 글롭들이 실제 파일과 맞는지 검사한다)
rsc_toolkit = ["configs/**/*.yaml", "configs/**/*.yml"]
"rsc_toolkit.datasets.icbhi" = ["data/*.txt"]
"rsc_toolkit.processors" = ["data/*.npy"]
"rsc_toolkit.datasets.sprsound" = ["data/metadata.csv"]
"rsc_toolkit.datasets.hflungv1" = ["data/metadata.csv"]

# Lungmix (ICASSP 2025, Ge et al.) ICBHI reproduction — **re-implementation from the paper specification (assumption run)** (the official code contains only the augmentation function).
#   non-linear (main): rsctk-train --config-name lungmix_icbhi run.name=icbhi-lungmix-nonlinear-s1 seed=1
#                      (= apply_loudness_mask=true, paper Eq. 3 blending, mix_stage=raw (mix original segments, then 9 s) → Table I 'Lungmix (non-linear)' 53.35)
#   w/o loudness     : ... model.params.apply_loudness_mask=false run.name=icbhi-lungmix-woloudness-s1
#                      (= official lungmix() output as is, random mask only → Table I 'Lungmix (w/o loudness)' 58.53; §III-C)
#   baseline w/o Mixup: ... model.params.variant=none run.name=icbhi-lungmix-none-s1
#   other variants   : model.params.variant={linear|combined|label_preservation|vanilla_mixup|lungmix_patchmix}
#   padded mixing alt: ... model.params.mix_stage=padded run.name=icbhi-lungmix-padded-s1 (mix after 9 s padding; optional run)
# Paper-reported: Fig.1 AST SFT 61.35 (selection criterion not specified; the Fig.1 HF (Test) column equals the Table I 'w/o Mixup' HF row 58.24/62.19/75.34 → likely the same
#       run/selection criterion), Table I (best by COMB) non-linear 53.35 / w/o loudness 58.53 / w/o Mixup 52.88 — for relative comparison.
#       Which row is the public function's output is unconfirmed — the row mapping follows the definition in paper §III-C (random mask only = w/o loudness).
# Assumptions: 50 epochs (not specified), wd 0, cosine T_max 50, no AMP, bs 4 × accumulate 8, mix original segments then 9 s (mix_stage raw; based on the maxlen notation in Eq. 3).
defaults:
  - model: ast_lungmix
  - data_defaults@data: base
  - data: icbhi_lungmix
  - loss: cross_entropy          # unweighted CE (the paper does not mention weighting)
  - metrics: icbhi_metrics
  - optimizer: adamw_lungmix
  - trainer: default
  - callbacks: lungmix_paper
  - _self_

seed: 1

model:
  params:
    apply_loudness_mask: true    # main run = paper Eq. 3 ('non-linear' row). false = official code output ('w/o loudness' row)

trainer:
  params:
    max_epochs: 50               # assumption (not specified)
    accumulate_grad_batches: 8   # paper §III-B
    precision: 32

run:
  name: icbhi-lungmix-nonlinear
  group: lungmix
  tags: [lungmix, icbhi]

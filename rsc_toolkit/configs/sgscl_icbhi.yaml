# sgscl 계열 재현 실행 config (AST 레시피: 50ep, bs8, adam 5e-5/wd 1e-6, cosine, MA 0.5).
#
#   SG-SCL : rsctk-train --config-name sgscl_icbhi
#   DAT    : ... model.params.method=dat run.name=icbhi-ast-dat
#   (seed 1~5 로 반복: seed=N)
#
# 손실은 비가중 CE — 원본 스크립트의 DAT/SG-SCL 은 --weighted_loss 를 안 쓴다.
# 전제: .datasets/icbhi 에 다운로드 + build-index 완료 (patchmix 와 피처 캐시 공유).
defaults:
  - model: ast_sgscl
  - data_defaults@data: base
  - data: icbhi_sgscl
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adam            # lr 5e-5, wd 1e-6 — 논문 값 그대로
  - trainer: default           # max_epochs 50
  - callbacks: sgscl_paper
  - _self_

seed: 1

trainer:
  params:
    precision: 16-mixed        # 원본 AMP(GradScaler+autocast)

run:
  name: icbhi-ast-sgscl
  group: sgscl
  tags: [sgscl, icbhi]

# BTS-CARD reproduction run config — default = official script (scripts/icbhi_causal_adversarial_debiasing_bts_meta_all.sh):
#   15 ep, bs 8 drop_last, adam 5e-5 / wd 1e-6, cosine(eta_min lr·1e-3), MA 0.5, AMP, unweighted CE, single seed 111.
# The paper §3.1 recipe (30 ep, AdamW) via overrides, e.g.:
#   rsctk-train --config-name btscard_icbhi trainer.params.max_epochs=30 optimizer.name=adamw run.name=icbhi-btscard-paper-s1 seed=1
# Toolkit main-result protocol: α=0 fixed, best on the official ICBHI test set (Se>5), seeds 1–5; SPRSound OOD uses the ICBHI-best ckpt with
#   scripts/reproduction/eval_btscard_checkpoint.py --ckpt outputs/btscard/<run>/best.pth --sprsound author,toolkit (α sweep reported alongside).
#
#   rsctk-train --config-name btscard_icbhi run.name=icbhi-btscard-s1 seed=1
defaults:
  - model: bts_card
  - data: bts_precomputed
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adam_btscard
  - trainer: default
  - callbacks: btscard_paper
  - _self_

seed: 1

trainer:
  params:
    max_epochs: 15             # official script (paper: 30)
    precision: 16-mixed        # official autocast + GradScaler (train: autocast for CLAP only, the rest fp32 — reproduced inside the model)

run:
  name: icbhi-btscard
  group: btscard
  tags: [btscard, bts, icbhi, ood-sprsound]

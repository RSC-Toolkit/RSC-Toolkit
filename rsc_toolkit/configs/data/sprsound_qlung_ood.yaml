# QLung SPRSound OOD 평가 뷰(학습 미사용): 7→4 병합 파생 라벨(**Rhonchi·Stridor 제외** — 2026-09-16 사용자 규칙), 16 kHz fbank 128×798,
#   ICBHI 와 같은 전처리 체인(가정 — 논문 미명시).
#   평가 범위: eval_qlung_ood.py 가 test_splits 를 [test](inter 1,429; 두 클래스 0 건이라 불변) 와 [train, test](8,031; 옛 병합 기준은 8,085) 로 바꿔 두 번 집계한다.
name: sprsound_qlung_ood
params:
  datamodule_name: qlung
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.qlung_data.QLungAQSIndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  label_map: sprsound_7to4

  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat_fade          # 가정: ICBHI 와 동일 (녹음 fade in/out + 8 s repeat + fade_out)
  fade: true
  resample_after_slice: false    # 가정: 녹음 전체를 16 kHz 로 리샘플 후 초 단위 절단 (ICBHI 체인)
  time_unit: s

  train_splits: [train]
  val_splits: [test]
  test_splits: [test]

  batch_size: 8
  num_workers: 8
  shuffle_train: false
  drop_last_train: false
  pin_memory: true

  features:
    enabled: true
    kind: fbank
    cache_dir: downloaded_datasets/features_cache_qlung_ood   # 별도 캐시 (전처리 체인이 캐시 키에 안 들어가므로)
    n_mels: 128
    target_frames: 798
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: true

  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

  specaugment:
    enabled: false

  qlung:
    alpha: 0.7
    beta: 0.3
    entropy_source: rms
    formula: code
    cache_dir: downloaded_datasets/aqs_cache
    precompute: true
    precompute_num_workers: 8
    attach_val: true

# SPRSound 확장용 **M2D 프로토콜** 데이터 설정 (AST 계열 백본용).
# M2D 의 SPRS 설정(configs/data/sprsound_m2d.yaml)에서 **모델 비종속 항목을 그대로 가져온다**:
#   8 s · pad_type sclmeta · resample_after_slice · time_unit ms_int · batch 64 · SpecAugment 없음 ·
#   2022 inter-patient test · 7-class.
# **바꿀 수 없는 것**: 특징 추출. M2D 는 sclmeta_mel 80-bin 을 쓰지만 AST 계열은 128×798 kaldi fbank 를
#   전제로 사전학습돼 있어 80-bin 을 먹일 수 없다 → 각 백본의 native 특징을 유지한다(문서에 명시).
name: sprsound_ast_m2dproto
params:
  datamodule_name: index
  dataset_name: sprsound
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: .datasets/sprsound
  raw_data_subdir: Classification
  index_filename: index_cycle.csv
  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: sclmeta              # M2D SPRS 와 동일
  fade: false
  resample_after_slice: true
  time_unit: ms_int
  train_splits: [train]
  val_splits: [test]             # 2022 inter-patient
  test_splits: [test]
  batch_size: 64                 # M2D SPRS 와 동일
  num_workers: 8
  shuffle_train: true
  drop_last_train: false
  pin_memory: true
  features:
    enabled: true
    kind: fbank                  # AST 계열 native (M2D 는 sclmeta_mel 80 — 백본 종속이라 옮길 수 없음)
    cache_dir: downloaded_datasets/features_cache
    n_mels: 128
    target_frames: 798
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: true
  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0
  specaugment:
    enabled: false               # M2D SPRS 와 동일 (patch-mix ICBHI 레시피의 SpecAug 는 쓰지 않음)

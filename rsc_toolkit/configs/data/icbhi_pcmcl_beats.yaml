# PC-MCL (BEATs) ICBHI: 16 kHz waveform, training = dynamic concatenation (11 combinations) · PM pairs (datamodule pcmcl), evaluation = single test cycles, 10 s repeat+fade.
name: icbhi_pcmcl_beats
params:
  datamodule_name: pcmcl

  dataset_name: icbhi
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  split_file: rsc_toolkit/datasets/icbhi/data/official_split.txt
  data_dir: .datasets/icbhi

  sampling_rate: 16000
  sample_level: cycle
  desired_length_sec: 10.0       # T=10 s stated in the paper (argparse default 8)
  pad_type: repeat_fade          # cut_pad_sample_torchaudio(repeat) — single evaluation cycles

  train_splits: [train]
  val_splits: [test]             # best-on-test protocol (main.py:1361-1370)
  test_splits: [test]

  batch_size: 32                 # argparse default 32 (train drop_last=True)
  num_workers: 8                 # official 0 (single python random stream) — per-worker streams, 'same distribution' (see the top of pcmcl_concat.py)
  shuffle_train: true
  drop_last_train: true
  pin_memory: true

  features:
    enabled: true
    kind: waveform               # fbank inside BEATs
  feature_precompute: false

  specaugment:
    enabled: false

  pcmcl:                         # PCMCLConcatDataset arguments (default = official code behavior)
    mode: default                # default | concat_single | noconcat_multi (Table 3 ablation)
    mixing_prob: 1.0             # paper: 'one augmentation per original' (argparse default 0.5)
    conditional_mixing: false
    mixing_label_strategy: additive
    enable_ssl: true
    ssl_prob: 0.3                # argparse default (not stated in the paper) — assumption
    patient_id_mode: recording   # quirk: in the official split mode patient_id = file name (recording). Paper intent: patient
    hard_negative_mode: dict_order   # quirk: first dict group with ≥2 entries (normal_only). Paper intent: random_profile; Table 5 'Base' = basic is a guess (the call is commented out in the code)
    cache_dir: outputs/pcmcl/cache

# Domain Transfer (ICASSP 2022) ICBHI data — resample to 8 kHz → split into cycles → circular padding to 8 s
# (+ training only: per-class splice samples · 3 waveform augmentations). Paper §2.1·§3.2, official 60/40 split.
# The model computes the spectrogram internally, so the waveform is passed as is (kind: waveform, no cache).
name: icbhi_domaintransfer
params:
  datamodule_name: domaintransfer
  dataset_name: icbhi
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  split_file: rsc_toolkit/datasets/icbhi/data/official_split.txt
  data_dir: .datasets/icbhi
  sampling_rate: 8000        # paper §3.2
  sample_level: cycle
  desired_length_sec: null   # DTIndexDataset fixes the length (circular padding, also applied to test)
  fade: false                # not in the paper (disables the toolkit default sr/16 fade)
  target_len: 64000          # 8 s @8 kHz — paper: "about 8 seconds"
  splice_per_class: 500      # Assumption: the paper states only "same number", not the count
  aug_prob: 0.5              # Assumption: application probability not specified
  use_noise: true            # white noise only (environmental noise not applied)
  use_stretch: true
  use_pitch: true
  train_splits: [train]
  val_splits: [test]
  test_splits: [test]
  batch_size: 64             # paper §3.2
  num_workers: 8
  shuffle_train: true
  drop_last_train: false
  pin_memory: true
  features:
    enabled: true
    kind: waveform
  feature_precompute: false
  specaugment:
    enabled: false           # all paper augmentations are handled directly at the waveform/spectrogram stage

# BTS (CLAP+TinyBERT) SPRSound extension — Audio-CLAP via the model=audioclap override
# **No paper-reported value** — the paper evaluates ICBHI only. This extends it to the standard SPRSound task (2022 inter-patient, 7-class)
# as a toolkit extension (no paper counterpart), not a reproduction target. The recipe is the paper's ICBHI recipe, unchanged.
defaults:
  - model: bts
  - data_defaults@data: base
  - data: sprsound_btscard_train   # SPR→SPR wiring: attaches meta7 to both train and val (the index path does not attach it to val, so BTS-family models crash in validation_step)
  - loss: cross_entropy
  - metrics: sprsound_metrics
  - optimizer: adam
  - trainer: default
  - callbacks: bts_paper
  - _self_

seed: 1

run:
  name: sprs-bts
  group: bts
  tags: [bts, sprsound, extension, variant]

model:
  params:
    n_cls: 7
    meta_dialect: sprsound     # **variant**: metadata sentences from only the 4 fields SPRSound has (age·gender·location·device) — adult_BMI·child_weight·child_height are absent

trainer:
  params:
    precision: 16-mixed

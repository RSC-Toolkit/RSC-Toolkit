# @package _global_
# sgscl paper AST training-protocol callbacks (same values as patch-mix — recipe from the same author lineage):
#   - 0.5:0.5 live average with the pre-iteration weights at every iteration (--ma_update --ma_beta 0.5)
#   - per-epoch cosine LR (eta_min = lr * 0.1^3), no warmup
#   - best-on-test selection: save when Score is best && Se > 5 (same as the official validate)
trainer:
  params:
    callbacks:
      - _target_: rsc_toolkit.trainer.callbacks.ma_update.LiveWeightAveraging
        beta: 0.5
      - _target_: rsc_toolkit.trainer.callbacks.paper_cosine_lr.PaperCosineLR
        learning_rate: ${optimizer.params.lr}        # single source: the optimizer group (a hard-coded copy would silently ignore CLI sweeps)
        epochs: ${trainer.params.max_epochs}
      - _target_: rsc_toolkit.trainer.callbacks.icbhi_best_checkpoint.ICBHIBestScoreCheckpoint
        dirpath: outputs/sgscl/${run.name}
        min_se: 5.0
      # per-epoch last.ckpt for resuming after an external interruption (deleted on normal completion)
      - _target_: rsc_toolkit.trainer.callbacks.resume_checkpoint.EpochResumeCheckpoint
        dirpath: outputs/sgscl/${run.name}

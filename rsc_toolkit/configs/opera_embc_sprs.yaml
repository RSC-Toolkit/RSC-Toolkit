# OPERA-CT 동결 + Tfm 헤드, SPRSound 7-class (EMBC'25; ev_sprs_opera.sh): 50ep, bs256, Adam 3e-4/wd 1e-4 + cosine(T_max 40),
#   비가중 CE, SpecAug(20/40 배치 공유), fp32, best-on-test Score. 목표(EMBC Table): 71.62±0.84.
#   실행: rsctk-train --config-name opera_embc_sprs run.name=sprs-operact-frozen-s1 seed=1
defaults:
  - model: opera_ct
  - data_defaults@data: base
  - data: sprsound_opera
  - loss: cross_entropy
  - metrics: sprsound_metrics
  - optimizer: adam_m2d
  - trainer: default
  - callbacks: opera_eval
  - _self_

seed: 1

model:
  params:
    n_cls: 7

optimizer:
  params:
    lr: 3e-4

trainer:
  params:
    max_epochs: 50
    precision: 32

run:
  name: sprs-operact-frozen
  group: opera
  tags: [opera, sprsound, frozen]

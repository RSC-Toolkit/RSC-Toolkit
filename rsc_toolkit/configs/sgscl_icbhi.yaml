# sgscl-family reproduction run config (AST recipe: 50 ep, bs 8, adam 5e-5/wd 1e-6, cosine, MA 0.5).
#
#   SG-SCL : rsctk-train --config-name sgscl_icbhi
#   DAT    : ... model.params.method=dat run.name=icbhi-ast-dat
#   (repeat for seeds 1-5: seed=N)
#
# Unweighted CE loss — DAT/SG-SCL in the official scripts do not use --weighted_loss.
# Prerequisite: .datasets/icbhi downloaded + build-index done (feature cache shared with patchmix).
defaults:
  - model: ast_sgscl
  - data_defaults@data: base
  - data: icbhi_sgscl
  - loss: cross_entropy
  - metrics: icbhi_metrics
  - optimizer: adam            # lr 5e-5, wd 1e-6 — paper values
  - trainer: default           # max_epochs 50
  - callbacks: sgscl_paper
  - _self_

seed: 1

trainer:
  params:
    precision: 16-mixed        # official AMP (GradScaler + autocast)

run:
  name: icbhi-ast-sgscl
  group: sgscl
  tags: [sgscl, icbhi]

name: index
params:
  datamodule_name: index

  dataset_name: hflungv1
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  data_dir: rsc_toolkit/datasets/hflungv1/data
  split_file: rsc_toolkit/datasets/hflungv1/data/index/official_split.txt

  sampling_rate: 48000
  sample_level: cycle
  desired_length_sec: 8.0
  pad_type: repeat

  train_splits: [train]
  val_splits: [test]
  test_splits: [test]

  batch_size: 8
  num_workers: 4
  shuffle_train: true

  features:
    enabled: true
    kind: clap
    cache_dir: downloaded_datasets/features_cache
    clap_model_name: laion/clap-htsat-unfused

  feature_precompute: true
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

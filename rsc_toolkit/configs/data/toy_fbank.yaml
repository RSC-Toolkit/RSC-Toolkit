name: toy
params:
  datamodule_name: index

  dataset_name: toy
  index_dataset_cls: rsc_toolkit.datasets.index_dataset.IndexDataset
  project_root: ${hydra:runtime.cwd}
  split_file: sample_data/toy_dataset/official_split.txt
  data_dir: downloaded_datasets/toy   # 먼저 `rsctk datasets build-index toy --data_dir downloaded_datasets/toy` 로 index/ 를 만든다 (원본 wav 는 번들 sample_data 로 폴백되지만 인덱스는 필요)

  sampling_rate: 16000
  sample_level: cycle

  train_splits: [train]
  val_splits: [test]
  test_splits: [test]

  batch_size: 32
  num_workers: 4
  shuffle_train: true

  features:
    enabled: true
    kind: fbank
    cache_dir: downloaded_datasets/features_cache_toy   # toy 전용 — ICBHI 파일과 sample_id 형식이 같아 공용 캐시를 쓰면 다른 config 의 피처를 읽을 수 있다 (REVIEW 2026-09-10 §7 P0)
    n_mels: 128
    target_frames: 1024
    frame_shift: 10
    window_type: hanning
    dither: 0.0
    normalize: true

  feature_precompute: false
  feature_precompute_batch_size: 8
  feature_precompute_num_workers: 0

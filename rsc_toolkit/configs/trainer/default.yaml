params:
  max_epochs: 50
  # Lightning's default ModelCheckpoint is disabled: validation weights are saved by ICBHIBestScoreCheckpoint to
  # outputs/<run>/best.pth, and resume checkpoints by EpochResumeCheckpoint directly via trainer.save_checkpoint.
  # The default artifacts (lightning_logs/<run>/version_*/checkpoints/epoch=*.ckpt, ~1 GB per run) are never referenced
  # and only take disk space. TensorBoard logs (tfevents) are still written.
  enable_checkpointing: false
  accelerator: auto
  devices: 1
  log_every_n_steps: 10
  
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: lightning_logs
    name: ${run.name}

  # Callbacks are not inlined here; they are selected from the `callbacks` config group.
  # (configs/callbacks/{ema,none}.yaml — see the defaults list of the top-level config)
  callbacks: []
